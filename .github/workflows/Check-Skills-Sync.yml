name: check-skills-sync

on:
  pull_request:
    paths:
      - ".agents/skills/obsidian-markdown/**"
      - ".agents/skills/obsidian-bases/**"
      - ".agents/skills/obsidian-cli/**"
      - ".agents/skills/defuddle/**"
      - ".github/skills/obsidian-markdown/**"
      - ".github/skills/obsidian-bases/**"
      - ".github/skills/obsidian-cli/**"
      - ".github/skills/defuddle/**"
      - "scripts/check-skills-sync.ps1"
      - ".github/workflows/Check-Skills-Sync.yml"
  push:
    branches: [main]
    paths:
      - ".agents/skills/obsidian-markdown/**"
      - ".agents/skills/obsidian-bases/**"
      - ".agents/skills/obsidian-cli/**"
      - ".agents/skills/defuddle/**"
      - ".github/skills/obsidian-markdown/**"
      - ".github/skills/obsidian-bases/**"
      - ".github/skills/obsidian-cli/**"
      - ".github/skills/defuddle/**"
      - "scripts/check-skills-sync.ps1"
      - ".github/workflows/Check-Skills-Sync.yml"

permissions:
  contents: read

concurrency:
  group: check-skills-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # 已停用，用家主要用 GPT-6 Luna，唔再同步去 .github，停用日期 2026-11-15
    if: false
    name: Check four selected repo skill mirrors
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare selected repository skills
        shell: pwsh
        run: ./scripts/check-skills-sync.ps1 -RepoOnly
