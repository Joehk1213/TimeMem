<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="description" content="TimeMem 示範介面：感受記憶回顧與記錄互動。">
  <title>TimeMem｜Remember what matters?</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    :root {
      --頁面底色: #FFFFFF;
      --卡片底色: #FFFFFF;
      --對話框底色: #FFFFFF;
      --品牌主色: #303030;
      --品牌深色: #171717;
      --品牌淺色: #F4F6F8;
      --主要文字色: #1D1D1D;
      --次要文字色: #4F4F4F;
      --邊框色: #E1E5E9;
      --成功色: #315D43;
      --提醒色: #77500B;
      --錯誤色: #9B3028;
      --鍵盤焦點色: #175A83;
      --遮罩色: rgba(24, 32, 40, 0.28);
      --介面字體: system-ui, sans-serif;
      --字元字體: ui-monospace, SFMono-Regular, Consolas, monospace;
      --背景鯊魚透明度: 0.68;
      --記憶卡透明面: rgba(255, 255, 255, 0.22);
      --輸入聚焦底色: #F8FAFC;
      --標題大小: 1.5rem;
      --正文大小: 1rem;
      --輔助文字大小: 0.875rem;
      --正文行高: 1.6;
      --間距極細: 0.25rem;
      --間距細: 0.5rem;
      --間距小: 0.75rem;
      --間距中: 1rem;
      --間距大: 1.5rem;
      --間距特大: 2rem;
      --小圓角: 0.5rem;
      --欄位圓角: 0.75rem;
      --卡片圓角: 1rem;
      --浮層陰影: 0 12px 32px rgba(24, 32, 40, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: #FFFFFF;
      scroll-behavior: smooth;
    }

    body {
      position: relative;
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      margin: 0;
      overflow-x: hidden;
      background: linear-gradient(
        180deg,
        #C6C6C6 0%,
        #F1F1F1 16%,
        #FFFFFF 32%,
        #FFFFFF 84%,
        #F2F2F2 100%
      );
      color: var(--主要文字色);
      font-family: var(--介面字體);
      font-size: var(--正文大小);
      line-height: var(--正文行高);
    }

    button,
    input {
      font: inherit;
    }

    button {
      min-width: 44px;
      min-height: 44px;
      border: 1px solid var(--邊框色);
      border-radius: var(--小圓角);
      padding: var(--間距細) var(--間距中);
      background: #FFFFFF;
      color: var(--主要文字色);
      cursor: pointer;
      text-decoration: none;
      text-underline-offset: 0.2em;
      transition: background-color 140ms ease, border-color 140ms ease, transform 140ms ease;
    }

    button:hover {
      border-color: #C8D0D8;
      background: #F8FAFC;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    :focus-visible {
      outline: 3px solid var(--鍵盤焦點色);
      outline-offset: 3px;
    }

    .site-header {
      position: relative;
      z-index: 4;
      display: flex;
      width: min(100% - 40px, 1120px);
      min-height: 80px;
      align-items: center;
      justify-content: space-between;
      gap: var(--間距中);
      margin: 0 auto;
      border-bottom: 1px solid var(--邊框色);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: var(--間距小);
      color: var(--主要文字色);
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-decoration: none;
    }

    .demo-badge,
    .demo-label {
      display: inline-flex;
      min-height: 28px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--邊框色);
      border-radius: 999px;
      padding: 0.1rem 0.65rem;
      background: var(--品牌淺色);
      color: var(--品牌深色);
      font-size: var(--輔助文字大小);
      font-weight: 700;
      line-height: 1.35;
      white-space: nowrap;
    }

    .demo-badge,
    .demo-label,
    .header-actions,
    .demo-controls,
    .site-footer {
      display: none;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: var(--間距細);
    }

    .button-secondary {
      border-color: var(--邊框色);
      background: #FFFFFF;
      color: var(--品牌深色);
    }

    .button-secondary:hover {
      border-color: #C8D0D8;
      background: #F8FAFC;
      color: var(--品牌深色);
    }

    .memory-field {
      position: fixed;
      z-index: 1;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .fish-field {
      position: fixed;
      z-index: 0;
      width: 100vw;
      height: 100vh;
      inset: 0;
      display: block;
      overflow: hidden;
      pointer-events: none;
      color: #1B1B1B;
      font-family: var(--字元字體);
      filter: blur(0.32px);
      opacity: var(--背景鯊魚透明度);
    }

    .memory-orbit {
      position: absolute;
      z-index: 2;
      display: grid;
      width: 196px;
      min-height: 84px;
      justify-items: start;
      align-content: start;
      gap: var(--間距細);
      border: 1px solid rgba(140, 150, 160, 0.34);
      border-radius: var(--卡片圓角);
      padding: var(--間距中);
      background: var(--記憶卡透明面);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(24, 32, 40, 0.035);
      color: var(--主要文字色);
      pointer-events: auto;
      text-align: left;
      text-decoration: none;
      animation: memory-drift var(--漂移時間, 28s) ease-in-out var(--漂移延遲, 0s) infinite alternate;
      transform-origin: center;
    }

    .memory-orbit:hover,
    .memory-orbit:focus-visible {
      z-index: 2;
      border-color: #C8D0D8;
      background: var(--記憶卡透明面);
      color: var(--主要文字色);
    }

    .memory-orbit:hover {
      animation-play-state: paused;
    }

    body.回顧已開啟 .memory-orbit {
      animation-play-state: paused;
    }

    .memory-orbit--one {
      top: 20%;
      left: max(18px, calc((100vw - 1160px) / 2));
    }

    .memory-orbit--two {
      top: 24%;
      right: max(18px, calc((100vw - 1160px) / 2));
    }

    .memory-orbit--three {
      bottom: 17%;
      left: max(42px, calc((100vw - 1100px) / 2));
    }

    .memory-orbit--four {
      right: max(42px, calc((100vw - 1100px) / 2));
      bottom: 14%;
    }

    .memory-orbit__topline {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: var(--間距細);
    }

    .memory-orbit__category {
      color: var(--次要文字色);
      font-size: var(--輔助文字大小);
    }

    .memory-orbit__title {
      font-size: 0.95rem;
      font-weight: 650;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .memory-orbit__caption {
      color: var(--次要文字色);
      font-size: var(--輔助文字大小);
    }

    .memory-orbit__picture,
    .dialog-picture {
      display: flex;
      width: 100%;
      min-height: 68px;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(140, 150, 160, 0.34);
      border-radius: var(--小圓角);
      background: rgba(255, 255, 255, 0.04);
      color: var(--品牌深色);
      font-size: var(--輔助文字大小);
      font-weight: 650;
    }

    @keyframes memory-drift {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
        border-radius: 1rem;
      }

      24% {
        transform: translate3d(var(--漂移一橫向), var(--漂移一縱向), 0) rotate(var(--漂移一角度)) scale(var(--縮放幅度));
        border-radius: 1.45rem 0.85rem 1.2rem 0.75rem;
      }

      50% {
        transform: translate3d(var(--漂移二橫向), var(--漂移二縱向), 0) rotate(var(--漂移二角度)) scale(0.98);
        border-radius: 0.75rem 1.4rem 0.8rem 1.25rem;
      }

      76% {
        transform: translate3d(var(--漂移三橫向), var(--漂移三縱向), 0) rotate(var(--漂移三角度)) scale(1.03);
        border-radius: 1.2rem 0.8rem 1.45rem 0.85rem;
      }

      100% {
        transform: translate3d(var(--漂移四橫向), var(--漂移四縱向), 0) rotate(var(--漂移四角度)) scale(1);
        border-radius: 0.85rem 1.3rem 0.75rem 1.4rem;
      }
    }

    .page-main {
      position: relative;
      z-index: 2;
      display: flex;
      width: min(100% - 40px, 720px);
      flex: 1;
      align-self: center;
      flex-direction: column;
      justify-content: center;
      padding: clamp(1.5rem, 5vh, 3rem) 0;
      background: transparent;
      text-align: center;
    }

    .entry-layer {
      position: relative;
      isolation: isolate;
    }

    .entry-layer::before {
      position: absolute;
      z-index: 0;
      inset: -0.75rem 15%;
      border-radius: var(--卡片圓角);
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      content: "";
      pointer-events: none;
    }

    .entry-layer > * {
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      margin: 0 0 var(--間距小);
      color: var(--品牌深色);
      font-size: var(--輔助文字大小);
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1.2;
      text-wrap: balance;
    }

    .intro {
      max-width: 36rem;
      margin: var(--間距中) auto 0;
      color: var(--次要文字色);
    }

    .entry-form {
      display: grid;
      width: 70%;
      grid-template-columns: auto minmax(0, 1fr) auto;
      grid-template-areas: "attachment field submit";
      align-items: center;
      gap: var(--間距細);
      margin: var(--間距中) auto 0;
      border: 1px solid rgba(140, 150, 160, 0.3);
      border-radius: var(--卡片圓角);
      padding: var(--間距細);
      background: rgba(255, 255, 255, 0.72);
      text-align: left;
      transition: background-color 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
    }

    .entry-form:focus-within {
      border-color: #A8B3BD;
      box-shadow: 0 0 0 3px rgba(48, 48, 48, 0.08);
    }

    .field-wrap {
      grid-area: field;
      display: grid;
      gap: 0.125rem;
    }

    .field-wrap label {
      color: var(--次要文字色);
      font-size: var(--輔助文字大小);
      font-weight: 500;
    }

    .field-wrap label,
    .entry-note,
    .demo-message {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    .field-wrap input {
      width: 100%;
      min-width: 0;
      min-height: 44px;
      border: 0;
      border-radius: var(--小圓角);
      padding: 0.5rem 0.75rem;
      background: transparent;
      color: var(--主要文字色);
    }

    .field-wrap input:focus {
      background: transparent;
      outline: none;
    }

    .field-wrap input:focus-visible {
      outline: 3px solid var(--鍵盤焦點色);
      outline-offset: 3px;
    }

    .field-wrap input::placeholder {
      color: var(--次要文字色);
      opacity: 1;
    }

    .entry-form > button[type="submit"] {
      grid-area: submit;
      width: 48px;
      min-height: 44px;
      padding: 0;
      border-color: var(--品牌主色);
      background: var(--品牌主色);
      color: #FFFFFF;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .entry-form > button[type="submit"]:hover {
      border-color: var(--品牌深色);
      background: var(--品牌深色);
      color: #FFFFFF;
    }

    .entry-form .attachment-button {
      position: relative;
      grid-area: attachment;
      width: 44px;
      min-height: 44px;
      border-color: transparent;
      padding: 0;
      background: transparent;
      color: var(--次要文字色);
      font-size: 1.75rem;
      font-weight: 400;
      line-height: 1;
    }

    .entry-form .attachment-button:hover {
      border-color: transparent;
      background: var(--品牌淺色);
      color: var(--品牌深色);
    }

    .attachment-count {
      position: absolute;
      top: -0.2rem;
      right: -0.2rem;
      min-width: 1.1rem;
      border: 1px solid var(--邊框色);
      border-radius: 999px;
      padding: 0 0.2rem;
      background: #FFFFFF;
      color: var(--次要文字色);
      font-size: 0.65rem;
      line-height: 1rem;
    }

    .entry-note {
      margin: var(--間距細) 0 0;
      color: var(--次要文字色);
      font-size: 0.8rem;
      text-align: center;
    }

    .demo-message {
      min-height: 1.6em;
      margin: var(--間距小) 0 0;
      color: var(--品牌深色);
      text-align: left;
    }

    .demo-message[data-kind="error"] {
      position: static;
      width: auto;
      height: auto;
      overflow: visible;
      clip: auto;
      white-space: normal;
      color: var(--錯誤色);
    }

    .demo-state-panel,
    .demo-list {
      border: 1px solid var(--邊框色);
      border-radius: var(--卡片圓角);
      padding: var(--間距大);
      background: #FFFFFF;
      text-align: left;
    }

    .demo-state-panel h2,
    .demo-list h2 {
      margin: var(--間距細) 0;
      font-size: var(--標題大小);
      line-height: 1.35;
    }

    .demo-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--間距細);
      margin-top: var(--間距大);
    }

    .demo-state-panel,
    .demo-list {
      margin-top: var(--間距中);
    }

    .demo-state-panel[hidden],
    .demo-list[hidden],
    [hidden] {
      display: none;
    }

    .demo-state-text {
      margin: var(--間距細) 0 var(--間距中);
      color: var(--次要文字色);
    }

    .demo-list ul {
      display: grid;
      gap: 0;
      margin: var(--間距中) 0 0;
      padding: 0;
      list-style: none;
    }

    .demo-list li + li {
      border-top: 1px solid var(--邊框色);
    }

    .demo-list-item {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: var(--間距中);
      border: 0;
      border-radius: 0;
      padding: var(--間距中) var(--間距細);
      background: transparent;
      color: var(--主要文字色);
      text-decoration: none;
      text-align: left;
    }

    .demo-list-item:hover {
      border-color: transparent;
      background: transparent;
      color: var(--主要文字色);
    }

    .demo-list-item__title {
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 650;
    }

    .demo-list-item__time {
      flex: 0 0 auto;
      color: var(--次要文字色);
      font-size: var(--輔助文字大小);
    }

    .site-footer {
      position: relative;
      z-index: 1;
      width: min(100% - 40px, 1120px);
      margin: 0 auto;
      border-top: 1px solid var(--邊框色);
      padding: var(--間距中) 0 var(--間距大);
      color: var(--次要文字色);
      font-size: var(--輔助文字大小);
      text-align: center;
    }

    body .site-header .header-actions,
    body .page-main .demo-controls,
    body .site-footer {
      display: none;
    }

    dialog {
      width: min(92vw, 480px);
      max-height: min(82vh, 720px);
      overflow: auto;
      border: 1px solid var(--邊框色);
      border-radius: var(--卡片圓角);
      padding: var(--間距大);
      background: var(--對話框底色);
      color: var(--主要文字色);
      box-shadow: var(--浮層陰影);
    }

    dialog::backdrop {
      background: var(--遮罩色);
    }

    .memory-dialog--hover {
      position: fixed;
      inset: auto;
      z-index: 20;
      margin: 0;
      border-color: rgba(140, 150, 160, 0.34);
      pointer-events: none;
      background: #FFFFFF;
      opacity: 1;
      box-shadow: 0 16px 40px rgba(24, 32, 40, 0.2);
    }

    .memory-dialog--hover .dialog-actions {
      display: none;
    }

    dialog h2 {
      margin: var(--間距中) 0 var(--間距細);
      font-size: var(--標題大小);
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    dialog p {
      overflow-wrap: anywhere;
    }

    .dialog-meta {
      color: var(--次要文字色);
      font-size: var(--輔助文字大小);
    }

    .dialog-picture {
      min-height: 148px;
      margin: var(--間距中) 0;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: var(--間距大);
    }

    @media (max-width: 760px) {
      :root {
        --背景鯊魚透明度: 0.68;
      }

      .site-header {
        width: min(100% - 28px, 1120px);
        min-height: 72px;
        gap: var(--間距細);
      }

      .brand {
        gap: var(--間距細);
        font-size: 1rem;
      }

      .header-actions {
        gap: 0.35rem;
      }

      .header-actions button {
        padding-inline: var(--間距細);
        font-size: var(--輔助文字大小);
      }

      .page-main {
        width: min(100% - 32px, 720px);
        padding-top: clamp(2.5rem, 8vh, 4rem);
        background: transparent;
      }
    }

    @media (max-width: 480px) {
      .site-header {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        padding: var(--間距小) 0;
      }

      .header-actions {
        width: 100%;
        justify-content: flex-start;
      }

      .page-main {
        width: min(100% - 32px, 720px);
        padding-top: 3rem;
      }

      .entry-form {
        width: 100%;
        gap: var(--間距小);
        margin-top: var(--間距大);
      }

      .entry-layer::before {
        inset: -0.75rem -1rem;
      }

      .demo-state-panel,
      .demo-list {
        padding: var(--間距中);
      }

      .demo-list-item {
        align-items: flex-start;
        flex-direction: column;
        gap: var(--間距細);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .memory-orbit {
        animation-name: memory-drift !important;
        animation-duration: var(--漂移時間, 15s) !important;
        animation-iteration-count: infinite !important;
        animation-direction: alternate !important;
      }

    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="TimeMem 示範首頁">
      <span>TimeMem</span>
      <span class="demo-badge">示範</span>
    </a>
    <nav class="header-actions" aria-label="示範操作">
      <button class="button-secondary" id="toggle-state" type="button" aria-controls="demo-state" aria-expanded="false">展示狀態</button>
      <button class="button-secondary" id="toggle-list" type="button" aria-controls="demo-list" aria-expanded="false">查看示範列表</button>
    </nav>
  </header>

  <main class="page-main">
    <div class="entry-layer">
      <h1>Remember what matters?</h1>

      <form class="entry-form" id="memory-form" novalidate>
        <div class="field-wrap">
          <label class="visually-hidden" for="memory-input">此刻的想法</label>
          <input id="memory-input" name="memory" type="text" maxlength="240" autocomplete="off" aria-describedby="entry-note">
        </div>
        <input class="visually-hidden" id="attachment-input" name="attachments" type="file" multiple tabindex="-1">
        <button class="attachment-button" id="attachment-button" type="button" aria-label="加入附件">+<span class="attachment-count" id="attachment-count" hidden aria-live="polite"></span></button>
        <button type="submit" aria-label="顯示預覽">→</button>
      </form>
    </div>

        try {
          drawSharks();
        } finally {
          context.fillRect = originalFillRect;
          context.globalAlpha = originalAlpha;
          for (let index = 0; index < modifiedShadeCells.length; index++) {
            shades[modifiedShadeCells[index]] = originalShadeValues[index];
          }
          modifiedShadeCells.length = 0;
          originalShadeValues.length = 0;
        }
      };
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const resizeObserver = new ResizeObserver(resizeWorld);
      const fixedStep = 1 / 60;
      const simulationSpeed = 2;
      const maxStepsPerFrame = Math.ceil(0.1 * simulationSpeed / fixedStep);
      let nextSpawnAt = randomBetween(3, 8);
      let nextEdgeTransitAt = randomBetween(4, 8);
      let nextMutationCheckAt = 5 * simulationSpeed;
      let mutateNextIncoming = false;
      let frameHandle = 0;
      let lastFrameTime = 0;
      let accumulator = 0;
      let sharkSpeedsAssigned = false;

      renderer.setFontFamily(getComputedStyle(canvas).fontFamily);

      function isPaused() {
        return document.hidden ||
        reducedMotion.matches ||
        document.body.classList.contains("回顧已開啟");
      }

      function keepSharksInView() {
        const margin = 8;
        world.sharks.forEach(function (shark) {
          const nodes = shark.nodes;
          let minX = Infinity;
          let maxX = -Infinity;
          let minY = Infinity;
          let maxY = -Infinity;
          for (let index = 0; index < nodes.length; index += 2) {
            minX = Math.min(minX, nodes[index]);
            maxX = Math.max(maxX, nodes[index]);
            minY = Math.min(minY, nodes[index + 1]);
            maxY = Math.max(maxY, nodes[index + 1]);
          }

          const offsetX = minX < margin
            ? margin - minX
            : maxX > world.width - margin
              ? world.width - margin - maxX
              : 0;
          const offsetY = minY < margin
            ? margin - minY
            : maxY > world.height - margin
              ? world.height - margin - maxY
              : 0;
          if (offsetX === 0 && offsetY === 0) {
            return;
          }

          for (let index = 0; index < nodes.length; index += 2) {
            nodes[index] += offsetX;
            nodes[index + 1] += offsetY;
          }
          shark.roamX = Math.min(world.width - margin, Math.max(margin, shark.roamX + offsetX));
          shark.roamY = Math.min(world.height - margin, Math.max(margin, shark.roamY + offsetY));
        });
      }

      function shiftWorld(dx, dy) {
        world.sharks.forEach(function (shark) {
          const nodes = shark.nodes;
          for (let index = 0; index < nodes.length; index += 2) {
            nodes[index] += dx;
            nodes[index + 1] += dy;
          }
          shark.roamX += dx;
          shark.roamY += dy;
        });
        world.fish.forEach(function (fish) {
          fish.x += dx;
          fish.y += dy;
        });
        world.noSwimZones.forEach(function (zone) {
          zone.left += dx;
          zone.right += dx;
          zone.top += dy;
          zone.bottom += dy;
        });
        world.pointer.x += dx;
        world.pointer.y += dy;
        world.events.forEach(function (event) {
          event.x += dx;
          event.y += dy;
        });
      }

      function stepWithExitSpace(delta) {
        const width = world.width;
        const height = world.height;
        const paddingX = width;
        const paddingY = height;
        shiftWorld(paddingX, paddingY);
        world.width = width + paddingX * 2;
        world.height = height + paddingY * 2;
        try {
          world.step(delta);
        } finally {
          shiftWorld(-paddingX, -paddingY);
          world.width = width;
          world.height = height;
        }
      }

      function createIncomingShark() {
        const kind = organismKinds[Math.floor(Math.random() * organismKinds.length)];
        const size = randomBetween(1, 3);
        const incomingWorld = new TimeMemSharks.World([{ kind: kind, size: size }], 0);
        incomingWorld.resize(world.width, world.height, renderer.cellWidth, renderer.cellHeight);
        const shark = incomingWorld.sharks[0];
        const side = Math.floor(Math.random() * 4);
        const headX = side === 0 ? -shark.length
          : side === 1 ? world.width + shark.length
            : randomBetween(world.width * 0.1, world.width * 0.9);
        const headY = side === 2 ? -shark.length
          : side === 3 ? world.height + shark.length
            : randomBetween(world.height * 0.1, world.height * 0.9);
        const heading = side === 0 ? 0
          : side === 1 ? Math.PI
            : side === 2 ? Math.PI / 2
              : -Math.PI / 2;
        const nodes = shark.nodes;
        const segmentLength = shark.length / (nodes.length / 2 - 1);
        shark.id = world.sharks.reduce(function (nextId, current) {
          return Math.max(nextId, current.id + 1);
        }, 1);
        shark.heading = heading;
        shark.speed = randomBetween(18, 30);
        shark.pace = randomBetween(0.9, 2.2) / simulationSpeed;
        shark.phase = randomBetween(0, Math.PI * 2);
        shark.turn = 0;
        shark.wander = 0;
        shark.hunger = randomBetween(0.25, 0.75);
        shark.target = null;
        shark.retargetAt = world.time + randomBetween(2, 5);
        shark.roamX = randomBetween(world.width * 0.1, world.width * 0.9);
        shark.roamY = randomBetween(world.height * 0.1, world.height * 0.9);
        shark.roamAt = world.time + randomBetween(8, 16);
        shark.exitAt = world.time + randomBetween(15, 35);
        shark.isExiting = false;
        shark.isEntering = true;
        shark.isEdgeSpawned = true;
        shark.edgeEntrySide = side;
        for (let index = 0; index < nodes.length; index += 2) {
          const segment = index / 2;
          nodes[index] = headX - Math.cos(heading) * segmentLength * segment;
          nodes[index + 1] = headY - Math.sin(heading) * segmentLength * segment;
        }
        shark.depth = randomBetween(0.35, 1);
        shark.visualOpacity = randomBetween(0.45, 1);
        shark.targetVisualOpacity = shark.visualOpacity;
        shark.shadeFactor = randomBetween(0.8, 2.5);
        shark.targetShadeFactor = shark.shadeFactor;
        shark.baseLength = shark.length;
        shark.visualScale = 1;
        shark.targetVisualScale = 1;
        shark.appliedVisualScale = 1;
        const depth = Math.fround(shark.depth);
        opacityByDepth.set(depth, shark.visualOpacity);
        shadeFactorByDepth.set(depth, shark.shadeFactor);
        if (mutateNextIncoming) {
          mutateNextIncoming = false;
          return convertIncomingSharkToEdgeTransit(shark);
        }
        return shark;
      }

      function getEdgeTransitPoint(side, margin) {
        return {
          x: side === 0 ? -margin
            : side === 1 ? world.width + margin
              : randomBetween(0, world.width),
          y: side === 2 ? -margin
            : side === 3 ? world.height + margin
              : randomBetween(0, world.height)
        };
      }

      function getEdgeTransitActionPoint() {
        return {
          x: randomBetween(world.width * 0.25, world.width * 0.75),
          y: randomBetween(world.height * 0.25, world.height * 0.75)
        };
      }

      function getNextEdgeTransitSide(excludedSide, previousSide) {
        const availableSides = [0, 1, 2, 3].filter(function (side) {
          return side !== excludedSide && side !== previousSide;
        });
        return availableSides[Math.floor(Math.random() * availableSides.length)];
      }

      function convertIncomingSharkToEdgeTransit(shark) {
        const startX = shark.nodes[0];
        const startY = shark.nodes[1];
        const startHeading = shark.heading;
        const startSide = shark.edgeEntrySide;
        const endSide = -1;
        const end = getEdgeTransitActionPoint();
        const duration = randomBetween(1, 3) * simulationSpeed;
        const pauseEnabled = Math.random() < 0.4;
        const transit = {
          startX: startX,
          startY: startY,
          endX: end.x,
          endY: end.y,
          endSide: endSide,
          originSide: startSide,
          legEndsAtEdge: false,
          startHeading: startHeading,
          startTime: world.time,
          duration: duration,
          progress: 0,
          pathLength: 0,
          speed: 0,
          actionsTotal: Math.floor(randomBetween(3, 6)),
          actionsCompleted: 0,
          actionMode: null,
          actionStartedAt: 0,
          actionDuration: 0,
          pendingEndX: 0,
          pendingEndY: 0,
          pendingEndSide: -1,
          pauseEnabled: pauseEnabled,
          pauseProgress: pauseEnabled ? randomBetween(0.25, 0.75) : 0,
          pauseDuration: pauseEnabled ? randomBetween(0.4, 0.8) * simulationSpeed : 0,
          pauseTriggered: false,
          isPaused: false,
          pauseX: 0,
          pauseY: 0,
          pauseHeading: startHeading,
          pauseStartedAt: 0
        };
        Object.assign(transit, createSpeedVariationState(world.time));
        createEdgeTransitPath(transit, startHeading, shark.length);
        transit.speed = transit.pathLength / duration;
        shark.edgeTransit = transit;
        shark.isEntering = false;
        shark.isExiting = false;
        shark.isEdgeSpawned = false;
        shark.speed = 0;
        shark.pace = 0;
        shark.hunger = 0;
        shark.target = null;
        shark.swimMotion = null;
        setEdgeTransitPosition(shark, transit, 0);
        return shark;
      }

      function createEdgeTransitShark() {
        const kind = organismKinds[Math.floor(Math.random() * organismKinds.length)];
        const size = randomBetween(1, 3);
        const transitWorld = new TimeMemSharks.World([{ kind: kind, size: size }], 0);
        transitWorld.resize(world.width, world.height, renderer.cellWidth, renderer.cellHeight);
        const shark = transitWorld.sharks[0];
        const actionsTotal = Math.floor(randomBetween(3, 6));
        const startSide = Math.floor(Math.random() * 4);
        const margin = shark.length;
        const start = getEdgeTransitPoint(startSide, margin);
        const endSide = -1;
        const end = getEdgeTransitActionPoint();
        const startX = start.x;
        const startY = start.y;
        const endX = end.x;
        const endY = end.y;
        const heading = Math.atan2(endY - startY, endX - startX);
        const duration = randomBetween(1, 3) * simulationSpeed;
        const pauseEnabled = Math.random() < 0.4;
        shark.id = world.sharks.reduce(function (nextId, current) {
          return Math.max(nextId, current.id + 1);
        }, 1);
        shark.heading = heading;
        shark.speed = 0;
        shark.pace = 0;
        shark.hunger = 0;
        shark.target = null;
        shark.isEntering = false;
        shark.isExiting = false;
        const transit = {
          startX: startX,
          startY: startY,
          endX: endX,
          endY: endY,
          endSide: endSide,
          originSide: startSide,
          legEndsAtEdge: false,
          startHeading: heading,
          startTime: world.time,
          duration: duration,
          progress: 0,
          pathLength: 0,
          speed: 0,
          actionsTotal: actionsTotal,
          actionsCompleted: 0,
          actionMode: null,
          actionStartedAt: 0,
          actionDuration: 0,
          pendingEndX: 0,
          pendingEndY: 0,
          pendingEndSide: -1,
          pauseEnabled: pauseEnabled,
          pauseProgress: pauseEnabled ? randomBetween(0.25, 0.75) : 0,
          pauseDuration: pauseEnabled ? randomBetween(0.4, 0.8) * simulationSpeed : 0,
          pauseTriggered: false,
          isPaused: false,
          pauseX: 0,
          pauseY: 0,
          pauseHeading: heading,
          pauseStartedAt: 0
        };
        Object.assign(transit, createSpeedVariationState(world.time));
        createEdgeTransitPath(transit, heading, shark.length);
        transit.speed = transit.pathLength / duration;
        shark.edgeTransit = transit;
        setEdgeTransitPosition(shark, transit, 0);
        shark.depth = randomBetween(0.35, 1);
        shark.visualOpacity = randomBetween(0.45, 1);
        shark.targetVisualOpacity = shark.visualOpacity;
        shark.shadeFactor = randomBetween(0.8, 2.5);
        shark.targetShadeFactor = shark.shadeFactor;
        shark.baseLength = shark.length;
        shark.visualScale = 1;
        shark.targetVisualScale = 1;
        shark.appliedVisualScale = 1;
        const depth = Math.fround(shark.depth);
        opacityByDepth.set(depth, shark.visualOpacity);
        shadeFactorByDepth.set(depth, shark.shadeFactor);
        return shark;
      }

      function replaceExitedSharks() {
        for (let index = world.sharks.length - 1; index >= 0; index--) {
          const shark = world.sharks[index];
          const nodes = shark.nodes;
          let minX = Infinity;
          let maxX = -Infinity;
          let minY = Infinity;
          let maxY = -Infinity;
          for (let node = 0; node < nodes.length; node += 2) {
            minX = Math.min(minX, nodes[node]);
            maxX = Math.max(maxX, nodes[node]);
            minY = Math.min(minY, nodes[node + 1]);
            maxY = Math.max(maxY, nodes[node + 1]);
          }
          const overlapsViewport = maxX >= 0 && minX <= world.width && maxY >= 0 && minY <= world.height;
          if (shark.isEntering) {
            if (overlapsViewport) {
              shark.isEntering = false;
              shark.exitAt = world.time + randomBetween(15, 35);
              if (shark.isEdgeSpawned && shark.swimMotion) {
                shark.swimMotion.nextDartAt = world.time + randomBetween(0.3, 1.2);
              }
            }
            continue;
          }
          if (shark.isExiting && (maxX < 0 || minX > world.width || maxY < 0 || minY > world.height)) {
            const residentCount = world.sharks.filter(function (candidate) {
              return !candidate.edgeTransit;
            }).length;
            if (residentCount > minimumSharks) {
              opacityByDepth.delete(Math.fround(shark.depth));
              shadeFactorByDepth.delete(Math.fround(shark.depth));
              world.sharks.splice(index, 1);
            } else {
              shark.isExiting = false;
              shark.isEntering = true;
              shark.exitAt = world.time + randomBetween(8, 16);
              shark.hunger = 0;
              shark.target = null;
              shark.roamX = randomBetween(world.width * 0.1, world.width * 0.9);
              shark.roamY = randomBetween(world.height * 0.1, world.height * 0.9);
              shark.roamAt = world.time + randomBetween(4, 8);
            }
          }
        }
      }

      function updateSharkPopulation() {
        if (world.time < nextSpawnAt) {
          return;
        }
        nextSpawnAt = world.time + randomBetween(3, 8);
        if (world.sharks.length < maximumSharks) {
          world.sharks.push(createIncomingShark());
        }
      }

      function updateRandomFishMutationCheck() {
        if (world.time < nextMutationCheckAt) {
          return;
        }
        nextMutationCheckAt = world.time + 5 * simulationSpeed;
        if (Math.random() < 1 / 3) {
          mutateNextIncoming = true;
        }
      }

      function updateEdgeTransitPopulation() {
        if (world.time < nextEdgeTransitAt) {
          return;
        }
        nextEdgeTransitAt = world.time + randomBetween(4, 8);
        if (world.sharks.length < maximumSharks) {
          world.sharks.push(createEdgeTransitShark());
        }
      }

      function getEdgeTransitPointOnPath(transit, progress) {
        const t = Math.max(0, Math.min(1, progress));
        if (!transit.pathSamples || transit.pathSamples.length < 2) {
          return getEdgeTransitRawPoint(transit, t);
        }
        const targetDistance = t * transit.pathLength;
        let low = 0;
        let high = transit.pathSamples.length - 1;
        while (low + 1 < high) {
          const middle = Math.floor((low + high) / 2);
          if (transit.pathSamples[middle].distance < targetDistance) {
            low = middle;
          } else {
            high = middle;
          }
        }
        const start = transit.pathSamples[low];
        const end = transit.pathSamples[high];
        const span = end.distance - start.distance;
        const blend = span > 0 ? (targetDistance - start.distance) / span : 0;
        return {
          x: start.x + (end.x - start.x) * blend,
          y: start.y + (end.y - start.y) * blend
        };
      }

      function getEdgeTransitRawPoint(transit, progress) {
        const t = Math.max(0, Math.min(1, progress));
        const inverse = 1 - t;
        const baseX = inverse * inverse * inverse * transit.startX
          + 3 * inverse * inverse * t * transit.controlX1
          + 3 * inverse * t * t * transit.controlX2
          + t * t * t * transit.endX;
        const baseY = inverse * inverse * inverse * transit.startY
          + 3 * inverse * inverse * t * transit.controlY1
          + 3 * inverse * t * t * transit.controlY2
          + t * t * t * transit.endY;
        const sine = Math.sin(Math.PI * t);
        const taper = sine * sine;
        let shape = 0;
        if (transit.routeType === "S") {
          shape = Math.sin(Math.PI * 2 * t) * taper;
        } else if (transit.routeType === "U") {
          shape = taper;
        } else if (transit.routeType === "W") {
          shape = Math.sin(Math.PI * 4 * t) * taper;
        } else if (transit.routeType === "Z") {
          const transition = Math.max(0, Math.min(1, (t - 0.2) / 0.6));
          const smoothTransition = transition * transition * (3 - 2 * transition);
          shape = (1 - 2 * smoothTransition) * taper;
        }
        const offset = shape * transit.routeAmplitude * transit.routeSign;
        return {
          x: baseX + transit.routeNormalX * offset,
          y: baseY + transit.routeNormalY * offset
        };
      }

      function createEdgeTransitPath(transit, startHeading, sharkLength) {
        const dx = transit.endX - transit.startX;
        const dy = transit.endY - transit.startY;
        const distance = Math.hypot(dx, dy);
        const endHeading = Math.atan2(dy, dx);
        const controlDistance = Math.min(distance * 0.42, Math.max(sharkLength * 1.5, distance * 0.2));
        const normalHeading = endHeading + Math.PI / 2;
        transit.controlX1 = transit.startX + Math.cos(startHeading) * controlDistance;
        transit.controlY1 = transit.startY + Math.sin(startHeading) * controlDistance;
        transit.controlX2 = transit.endX - Math.cos(endHeading) * controlDistance;
        transit.controlY2 = transit.endY - Math.sin(endHeading) * controlDistance;
        transit.routeType = ["S", "U", "W", "Z"][Math.floor(Math.random() * 4)];
        transit.routeSign = Math.random() < 0.5 ? -1 : 1;
        transit.routeAmplitude = Math.min(
          distance * 0.2,
          Math.min(world.width, world.height) * randomBetween(0.12, 0.28)
        );
        transit.routeNormalX = Math.cos(normalHeading);
        transit.routeNormalY = Math.sin(normalHeading);
        const samples = [];
        let pathLength = 0;
        let previousPoint = null;
        for (let index = 0; index <= 96; index++) {
          const point = getEdgeTransitRawPoint(transit, index / 96);
          if (previousPoint) {
            pathLength += Math.hypot(point.x - previousPoint.x, point.y - previousPoint.y);
          }
          samples.push({
            x: point.x,
            y: point.y,
            distance: pathLength
          });
          previousPoint = point;
        }
        transit.pathSamples = samples;
        transit.pathLength = pathLength;
      }

      function getEdgeTransitHeading(transit, progress) {
        const t = Math.max(0, Math.min(1, progress));
        const before = getEdgeTransitPointOnPath(transit, Math.max(0, t - 0.005));
        const after = getEdgeTransitPointOnPath(transit, Math.min(1, t + 0.005));
        const dx = after.x - before.x;
        const dy = after.y - before.y;
        return Math.atan2(dy, dx);
      }

      function setEdgeTransitPosition(shark, transit, progress) {
        const head = getEdgeTransitPointOnPath(transit, progress);
        const heading = getEdgeTransitHeading(transit, progress);
        const nodes = shark.nodes;
        const segmentLength = shark.length / (nodes.length / 2 - 1);
        const transitionNodes = transit.transitionNodes;
        const transitionBlend = transitionNodes ? smoothStep(progress / 0.16) : 1;
        shark.heading = heading;
        for (let node = 0; node < nodes.length; node += 2) {
          const segment = node / 2;
          const nodeProgress = progress - segment * segmentLength / transit.pathLength;
          let nodeX;
          let nodeY;
          if (nodeProgress < 0) {
            const distanceBehindStart = -nodeProgress * transit.pathLength;
            nodeX = transit.startX - Math.cos(transit.startHeading) * distanceBehindStart;
            nodeY = transit.startY - Math.sin(transit.startHeading) * distanceBehindStart;
          } else {
            const point = getEdgeTransitPointOnPath(transit, nodeProgress);
            nodeX = point.x;
            nodeY = point.y;
          }
          nodes[node] = transitionNodes
            ? transitionNodes[node] + (nodeX - transitionNodes[node]) * transitionBlend
            : nodeX;
          nodes[node + 1] = transitionNodes
            ? transitionNodes[node + 1] + (nodeY - transitionNodes[node + 1]) * transitionBlend
            : nodeY;
        }
        nodes[0] = head.x;
        nodes[1] = head.y;
        if (progress >= 0.16) {
          transit.transitionNodes = null;
        }
      }

      function configureEdgeTransitPause(transit) {
        transit.pauseEnabled = Math.random() < 0.4;
        transit.pauseProgress = transit.pauseEnabled ? randomBetween(0.25, 0.75) : 0;
        transit.pauseDuration = transit.pauseEnabled ? randomBetween(0.4, 0.8) * simulationSpeed : 0;
        transit.pauseTriggered = false;
        transit.isPaused = false;
      }

      function startNextEdgeTransitLeg(shark, transit) {
        const transitionNodes = new Float32Array(shark.nodes);
        transit.startX = transit.endX;
        transit.startY = transit.endY;
        transit.startHeading = transit.pendingStartHeading;
        transit.endX = transit.pendingEndX;
        transit.endY = transit.pendingEndY;
        transit.endSide = transit.pendingEndSide;
        transit.legEndsAtEdge = Number.isInteger(transit.pendingEndSide);
        transit.startTime = world.time;
        transit.progress = 0;
        transit.duration = randomBetween(1, 3) * simulationSpeed;
        createEdgeTransitPath(transit, transit.startHeading, shark.length);
        transit.speed = transit.pathLength / transit.duration;
        transit.transitionNodes = transitionNodes;
        transit.actionMode = null;
        shark.orbitAction = null;
        shark.speed = 0;
        shark.pace = 0;
        configureEdgeTransitPause(transit);
        setEdgeTransitPosition(shark, transit, 0);
      }

      function finishEdgeTransitLeg(index, shark, transit) {
        transit.actionsCompleted++;
        if (transit.actionsCompleted >= transit.actionsTotal) {
          opacityByDepth.delete(Math.fround(shark.depth));
          shadeFactorByDepth.delete(Math.fround(shark.depth));
          world.sharks.splice(index, 1);
          return;
        }
        setEdgeTransitPosition(shark, transit, 1);
        const nextIsFinalLeg = transit.actionsCompleted + 1 >= transit.actionsTotal;
        let nextEnd;
        let nextSide = -1;
        if (nextIsFinalLeg) {
          nextSide = getNextEdgeTransitSide(
            transit.originSide,
            Number.isInteger(transit.endSide) ? transit.endSide : -1
          );
          nextEnd = getEdgeTransitPoint(nextSide, shark.length);
        } else {
          nextEnd = getEdgeTransitActionPoint();
        }
        transit.pendingEndX = nextEnd.x;
        transit.pendingEndY = nextEnd.y;
        transit.pendingEndSide = nextSide;
        transit.pendingStartHeading = getEdgeTransitHeading(transit, 1);
        const actionRoll = Math.random();
        if (actionRoll < 0.3) {
          transit.actionMode = "rest";
          transit.actionStartedAt = world.time;
          transit.actionDuration = randomBetween(3, 6) * simulationSpeed;
          setEdgeTransitPosition(shark, transit, 1);
        } else if (actionRoll < 0.55) {
          transit.actionMode = "orbit";
          transit.actionStartedAt = world.time;
          shark.orbitAction = createOrbitAction(shark, world.time);
          transit.actionDuration = shark.orbitAction.duration;
          shark.speed = 0;
          shark.pace = 0;
        } else {
          startNextEdgeTransitLeg(shark, transit);
        }
      }

      function updateEdgeTransits(delta) {
        for (let index = world.sharks.length - 1; index >= 0; index--) {
          const shark = world.sharks[index];
          const transit = shark.edgeTransit;
          if (!transit) {
            continue;
          }
          updateSpeedVariation(transit, world.time);
          if (transit.actionMode === "rest") {
            setEdgeTransitPosition(shark, transit, 1);
            if (world.time - transit.actionStartedAt >= transit.actionDuration) {
              startNextEdgeTransitLeg(shark, transit);
            }
            continue;
          }
          if (transit.actionMode === "orbit") {
            if (world.time - transit.actionStartedAt >= transit.actionDuration) {
              startNextEdgeTransitLeg(shark, transit);
            }
            continue;
          }
          if (transit.isPaused) {
            if (world.time - transit.pauseStartedAt < transit.pauseDuration) {
              setEdgeTransitPosition(shark, transit, transit.pauseProgress);
              continue;
            }
            let endSide = -1;
            let end;
            if (transit.legEndsAtEdge) {
              endSide = getNextEdgeTransitSide(transit.originSide, transit.endSide);
              end = getEdgeTransitPoint(endSide, shark.length);
            } else {
              end = getEdgeTransitActionPoint();
            }
            const transitionNodes = new Float32Array(shark.nodes);
            transit.startX = transit.pauseX;
            transit.startY = transit.pauseY;
            transit.endX = end.x;
            transit.endY = end.y;
            transit.endSide = endSide;
            transit.startHeading = transit.pauseHeading;
            transit.transitionNodes = transitionNodes;
            createEdgeTransitPath(transit, transit.startHeading, shark.length);
            transit.startTime = world.time;
            transit.duration = transit.pathLength / transit.speed;
            transit.progress = 0;
            transit.pauseTriggered = true;
            transit.isPaused = false;
            continue;
          }
          transit.progress = Math.min(
            1,
            transit.progress + delta * transit.speedFactor / transit.duration
          );
          const progress = transit.progress;
          if (transit.pauseEnabled && !transit.pauseTriggered && progress >= transit.pauseProgress && progress < 1) {
            const pausePoint = getEdgeTransitPointOnPath(transit, transit.pauseProgress);
            transit.pauseX = pausePoint.x;
            transit.pauseY = pausePoint.y;
            transit.pauseHeading = getEdgeTransitHeading(transit, transit.pauseProgress);
            transit.pauseStartedAt = world.time;
            transit.isPaused = true;
            setEdgeTransitPosition(shark, transit, transit.pauseProgress);
            continue;
          }
          if (progress >= 1) {
            finishEdgeTransitLeg(index, shark, transit);
            continue;
          }
          setEdgeTransitPosition(shark, transit, progress);
        }
      }

      function restoreSwimBends() {
        world.sharks.forEach(function (shark) {
          const motion = shark.swimMotion;
          if (!motion) {
            return;
          }
          const nodes = shark.nodes;
          for (let index = 2; index < nodes.length; index += 2) {
            nodes[index] -= motion.offsets[index];
            nodes[index + 1] -= motion.offsets[index + 1];
          }
          motion.offsets.fill(0);
        });
      }

      function restoreVisualSizes() {
        world.sharks.forEach(function (shark) {
          const scale = shark.appliedVisualScale || 1;
          if (scale === 1 || !shark.baseLength) {
            return;
          }
          const nodes = shark.nodes;
          const headX = nodes[0];
          const headY = nodes[1];
          for (let index = 2; index < nodes.length; index += 2) {
            nodes[index] = headX + (nodes[index] - headX) / scale;
            nodes[index + 1] = headY + (nodes[index + 1] - headY) / scale;
          }
          shark.length = shark.baseLength;
          shark.appliedVisualScale = 1;
        });
      }

      function applyVisualSizes() {
        world.sharks.forEach(function (shark) {
          const scale = shark.visualScale || 1;
          if (!shark.baseLength || scale === 1) {
            return;
          }
          const nodes = shark.nodes;
          const headX = nodes[0];
          const headY = nodes[1];
          for (let index = 2; index < nodes.length; index += 2) {
            nodes[index] = headX + (nodes[index] - headX) * scale;
            nodes[index + 1] = headY + (nodes[index + 1] - headY) * scale;
          }
          shark.length = shark.baseLength * scale;
          shark.appliedVisualScale = scale;
        });
      }

      function getBurstPulse(motion, time) {
        if (time < motion.burstStart || time >= motion.burstUntil) {
          return 0;
        }
        const progress = (time - motion.burstStart) / (motion.burstUntil - motion.burstStart);
        const envelope = Math.sin(progress * Math.PI);
        return envelope * envelope;
      }

      function smoothStep(value) {
        const progress = Math.max(0, Math.min(1, value));
        return progress * progress * (3 - 2 * progress);
      }

      function createSpeedVariationState(time) {
        return {
          speedFactor: 1,
          speedFrom: 1,
          speedTarget: 1,
          speedChangeStart: time,
          speedChangeEnd: time,
          nextSpeedChangeAt: time + randomBetween(2, 5) * simulationSpeed
        };
      }

      function updateSpeedVariation(state, time) {
        const transition = state.speedChangeEnd > state.speedChangeStart
          ? (time - state.speedChangeStart) / (state.speedChangeEnd - state.speedChangeStart)
          : 1;
        state.speedFactor = state.speedFrom
          + (state.speedTarget - state.speedFrom) * smoothStep(transition);
        if (time >= state.nextSpeedChangeAt) {
          state.speedFrom = state.speedFactor;
          state.speedTarget = randomBetween(0.65, 1.45);
          state.speedChangeStart = time;
          state.speedChangeEnd = time + randomBetween(0.8, 1.6) * simulationSpeed;
          state.nextSpeedChangeAt = time + randomBetween(2, 5) * simulationSpeed;
        }
        return state.speedFactor;
      }

      function createOrbitAction(shark, time) {
        const direction = Math.random() < 0.5 ? -1 : 1;
        return {
          startTime: time,
          duration: randomBetween(2, 4) * simulationSpeed,
          turns: Math.floor(randomBetween(1, 3)),
          direction: direction,
          radius: Math.min(
            Math.max(shark.length * 0.8, 16),
            Math.min(world.width, world.height) * 0.12
          ),
          baseNodes: null,
          baseHeading: shark.heading,
          centerX: 0,
          centerY: 0,
          startAngle: 0
        };
      }

      function restoreSwimOrbits() {
        world.sharks.forEach(function (shark) {
          const orbit = shark.orbitAction;
          if (!orbit || !orbit.baseNodes) {
            return;
          }
          shark.nodes.set(orbit.baseNodes);
          shark.heading = orbit.baseHeading;
        });
      }

      function applySwimOrbits() {
        world.sharks.forEach(function (shark) {
          const orbit = shark.orbitAction;
          if (!orbit) {
            return;
          }
          if (!orbit.baseNodes) {
            orbit.baseNodes = new Float32Array(shark.nodes);
            orbit.baseHeading = shark.heading;
            orbit.startAngle = orbit.baseHeading - orbit.direction * Math.PI / 2;
            orbit.centerX = shark.nodes[0] - Math.cos(orbit.startAngle) * orbit.radius;
            orbit.centerY = shark.nodes[1] - Math.sin(orbit.startAngle) * orbit.radius;
          }
          const progress = Math.max(0, Math.min(1, (world.time - orbit.startTime) / orbit.duration));
          const blend = Math.min(smoothStep(progress / 0.12), smoothStep((1 - progress) / 0.12));
          const angle = orbit.startAngle + orbit.direction * Math.PI * 2 * orbit.turns * progress;
          const nodes = shark.nodes;
          const segmentLength = shark.length / (nodes.length / 2 - 1);
          for (let index = 0; index < nodes.length; index += 2) {
            const segment = index / 2;
            const nodeAngle = angle - orbit.direction * segmentLength * segment / orbit.radius;
            const circleX = orbit.centerX + Math.cos(nodeAngle) * orbit.radius;
            const circleY = orbit.centerY + Math.sin(nodeAngle) * orbit.radius;
            nodes[index] = orbit.baseNodes[index]
              + (circleX - orbit.baseNodes[index]) * blend;
            nodes[index + 1] = orbit.baseNodes[index + 1]
              + (circleY - orbit.baseNodes[index + 1]) * blend;
          }
          if (blend > 0.01) {
            shark.heading = angle + orbit.direction * Math.PI / 2;
          }
        });
      }

      function chooseMotionProfile() {
        const roll = Math.random();
        if (roll < 0.7) {
          return {
            mode: "cruise",
            idlePace: randomBetween(0.72, 1.08),
            phaseSpeed: randomBetween(0.35, 0.8),
            burstGain: randomBetween(0.25, 0.65),
            pauseChance: 0.03,
            pauseMin: 0.25,
            pauseMax: 0.6,
            burstMin: 0.7,
            burstMax: 1.2,
          };
        }
        if (roll < 0.9) {
          return {
            mode: "drift",
            idlePace: randomBetween(0.32, 0.58),
            phaseSpeed: randomBetween(0.15, 0.4),
            burstGain: randomBetween(1.2, 2),
            pauseChance: 0.18,
            pauseMin: 0.5,
            pauseMax: 1.2,
            burstMin: 0.8,
            burstMax: 1.4,
          };
        }
        return {
          mode: "rest-burst",
          idlePace: randomBetween(0, 0.12),
          phaseSpeed: randomBetween(0, 0.16),
          burstGain: randomBetween(2.4, 3.2),
          pauseChance: 0.38,
          pauseMin: 1,
          pauseMax: 2.1,
          burstMin: 0.9,
          burstMax: 1.7,
        };
      }

      function updateSwimMotion(delta) {
        const time = world.time;
        const residentCount = world.sharks.filter(function (shark) {
          return !shark.edgeTransit;
        }).length;
        let exitingCount = world.sharks.filter(function (shark) {
          return !shark.edgeTransit && shark.isExiting;
        }).length;
        world.sharks.forEach(function (shark) {
          if (shark.edgeTransit) {
            return;
          }
          if (!shark.isExiting && !shark.isEntering && time >= shark.exitAt) {
            if (residentCount - exitingCount > minimumSharks) {
              const exitSide = Math.floor(Math.random() * 4);
              shark.isExiting = true;
              exitingCount++;
              shark.roamX = exitSide === 0 ? -world.width
                : exitSide === 1 ? world.width * 2
                  : randomBetween(world.width * 0.1, world.width * 0.9);
              shark.roamY = exitSide === 2 ? -world.height
                : exitSide === 3 ? world.height * 2
                  : randomBetween(world.height * 0.1, world.height * 0.9);
              shark.roamAt = Infinity;
              shark.target = null;
            } else {
              shark.exitAt = time + randomBetween(5, 12);
            }
          }
          if (shark.isExiting) {
            shark.hunger = 0;
          }
          if (!shark.swimMotion) {
            const profile = chooseMotionProfile();
            shark.swimMotion = Object.assign({
              phase: randomBetween(0, Math.PI * 2),
              nextAction: time + randomBetween(2, 5),
              nextDartAt: time + randomBetween(4, 12),
              dartStart: 0,
              dartUntil: 0,
              dartGain: 1,
              burstStart: 0,
              burstUntil: 0,
              pauseUntil: 0,
              basePace: shark.pace,
              offsets: new Float32Array(shark.nodes.length)
            }, createSpeedVariationState(time), profile);
          }
          const motion = shark.swimMotion;
          if (shark.orbitAction && time - shark.orbitAction.startTime >= shark.orbitAction.duration) {
            shark.orbitAction = null;
          }
          if (time >= motion.nextAction && time >= motion.pauseUntil && !shark.orbitAction) {
            Object.assign(motion, chooseMotionProfile());
            shark.targetVisualScale = randomBetween(0.9, 1.1);
            shark.targetVisualOpacity = randomBetween(0.45, 1);
            shark.targetShadeFactor = randomBetween(0.8, 2.5);
            motion.pauseUntil = Math.random() < motion.pauseChance
              ? time + randomBetween(motion.pauseMin, motion.pauseMax)
              : time;
            motion.burstStart = motion.pauseUntil;
            motion.burstUntil = motion.burstStart + randomBetween(motion.burstMin, motion.burstMax);
            motion.nextAction = time + randomBetween(2, 5);
            if (Math.random() < 0.08) {
              motion.pauseUntil = time + randomBetween(3, 6) * simulationSpeed;
              motion.burstStart = motion.pauseUntil;
              motion.burstUntil = motion.burstStart + randomBetween(motion.burstMin, motion.burstMax);
              motion.nextAction = motion.pauseUntil + randomBetween(2, 5) * simulationSpeed;
            } else if (Math.random() < 0.08) {
              shark.orbitAction = createOrbitAction(shark, time);
              motion.nextAction = time + shark.orbitAction.duration + randomBetween(2, 5) * simulationSpeed;
            }
          }
          const speedFactor = updateSpeedVariation(motion, time);
          if (!shark.isExiting && !shark.isEntering && !shark.orbitAction && time >= motion.pauseUntil && time >= motion.nextDartAt) {
            motion.nextDartAt = time + (shark.isEdgeSpawned ? randomBetween(2, 5) : randomBetween(4, 10));
            const dartChance = shark.isEdgeSpawned ? 0.9 : 0.35;
            if (Math.random() < dartChance) {
              const isEdgeDash = shark.isEdgeSpawned;
              motion.dartStart = time;
              motion.dartUntil = time + randomBetween(isEdgeDash ? 0.9 : 0.7, isEdgeDash ? 1.6 : 1.4);
              motion.dartGain = randomBetween(isEdgeDash ? 2.6 : 1.8, isEdgeDash ? 3.5 : 3);
              motion.pauseUntil = Math.min(motion.pauseUntil, time);
              const headX = shark.nodes[0];
              const headY = shark.nodes[1];
              const canExitDuringDart = shark.isEdgeSpawned
                && headX >= 0 && headX <= world.width
                && headY >= 0 && headY <= world.height
                && residentCount - exitingCount > minimumSharks;
              if (canExitDuringDart) {
                let exitSide = shark.edgeEntrySide;
                if (!Number.isInteger(exitSide)) {
                  const exitDistances = [headX, world.width - headX, headY, world.height - headY];
                  exitSide = 0;
                  for (let side = 1; side < exitDistances.length; side++) {
                    if (exitDistances[side] < exitDistances[exitSide]) {
                      exitSide = side;
                    }
                  }
                }
                shark.roamX = exitSide === 0 ? -world.width
                  : exitSide === 1 ? world.width * 2
                    : headX;
                shark.roamY = exitSide === 2 ? -world.height
                  : exitSide === 3 ? world.height * 2
                    : headY;
                shark.roamAt = Infinity;
                shark.target = null;
                shark.isExiting = true;
                shark.hunger = 0;
                exitingCount++;
                shark.isEdgeSpawned = false;
              } else {
                shark.roamX = randomBetween(world.width * 0.08, world.width * 0.92);
                shark.roamY = randomBetween(world.height * 0.08, world.height * 0.92);
                shark.roamAt = motion.dartUntil;
              }
            }
          }
          const paused = time < motion.pauseUntil || !!shark.orbitAction;
          const burstPulse = getBurstPulse(motion, time);
          const dartPulse = getBurstPulse({
            burstStart: motion.dartStart,
            burstUntil: motion.dartUntil
          }, time);
          shark.pace = paused ? 0 : motion.basePace * Math.min(
            3.2,
            motion.idlePace + burstPulse * motion.burstGain + dartPulse * motion.dartGain
          ) * speedFactor;
          if (paused) {
            shark.speed = 0;
          }
          motion.phase += delta * (paused ? 0 : motion.phaseSpeed + burstPulse * 5.2 + dartPulse * 3.5);
          const blend = Math.min(1, delta * 1.5);
          shark.visualScale += (shark.targetVisualScale - shark.visualScale) * blend;
          shark.visualOpacity += (shark.targetVisualOpacity - shark.visualOpacity) * blend;
          shark.shadeFactor += (shark.targetShadeFactor - shark.shadeFactor) * blend;
          const depth = Math.fround(shark.depth);
          opacityByDepth.set(depth, shark.visualOpacity);
          shadeFactorByDepth.set(depth, shark.shadeFactor);
        });
      }

      function applySwimBends() {
        world.sharks.forEach(function (shark) {
          const motion = shark.swimMotion;
          if (!motion) {
            return;
          }
          const nodes = shark.nodes;
          const headX = nodes[0];
          const headY = nodes[1];
          const sideX = -Math.sin(shark.heading);
          const sideY = Math.cos(shark.heading);
          const burstPulse = getBurstPulse(motion, world.time);
          const amplitude = Math.min(20, shark.length * (0.01 + burstPulse * 0.075));
          const lastNode = nodes.length - 2;
          for (let index = 2; index <= lastNode; index += 2) {
            const progress = index / lastNode;
            const wave = progress * amplitude * Math.sin(motion.phase - progress * Math.PI * 2);
            const offsetX = sideX * wave;
            const offsetY = sideY * wave;
            nodes[index] = headX + (nodes[index] - headX) + offsetX;
            nodes[index + 1] = headY + (nodes[index + 1] - headY) + offsetY;
            motion.offsets[index] = offsetX;
            motion.offsets[index + 1] = offsetY;
          }
        });
      }

      function resizeWorld() {
        const bounds = canvas.getBoundingClientRect();
        if (bounds.width < 1 || bounds.height < 1) {
          return;
        }
        restoreSwimBends();
        restoreVisualSizes();
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
        renderer.resize(bounds.width, bounds.height, pixelRatio);
        world.resize(bounds.width, bounds.height, renderer.cellWidth, renderer.cellHeight);
        if (!sharkSpeedsAssigned && world.sharks.length) {
          world.sharks.forEach(function (shark) {
            shark.pace = randomBetween(0.9, 2.2) / simulationSpeed;
            shark.exitAt = world.time + randomBetween(15, 35);
            shark.depth = randomBetween(0.35, 1);
            shark.visualOpacity = randomBetween(0.45, 1);
            shark.targetVisualOpacity = shark.visualOpacity;
            shark.shadeFactor = randomBetween(0.8, 2.5);
            shark.targetShadeFactor = shark.shadeFactor;
            shark.baseLength = shark.length;
            shark.visualScale = 1;
            shark.targetVisualScale = 1;
            shark.appliedVisualScale = 1;
            const depth = Math.fround(shark.depth);
            opacityByDepth.set(depth, shark.visualOpacity);
            shadeFactorByDepth.set(depth, shark.shadeFactor);
          });
          sharkSpeedsAssigned = true;
        }
        keepSharksInView();
        renderer.render(world);
      }

      function stopAnimation() {
        if (frameHandle) {
          window.cancelAnimationFrame(frameHandle);
          frameHandle = 0;
        }
        lastFrameTime = 0;
        accumulator = 0;
      }

      function animate(now) {
        frameHandle = 0;
        if (isPaused()) {
          stopAnimation();
          return;
        }
        const elapsed = lastFrameTime ? Math.min((now - lastFrameTime) / 1000, 0.1) : 0;
        lastFrameTime = now;
        accumulator += elapsed * simulationSpeed;
        let steps = 0;
        while (accumulator >= fixedStep && steps < maxStepsPerFrame) {
          restoreSwimBends();
          restoreSwimOrbits();
          restoreVisualSizes();
          updateSwimMotion(fixedStep);
          stepWithExitSpace(fixedStep);
          updateEdgeTransits(fixedStep);
          applyVisualSizes();
          applySwimOrbits();
          applySwimBends();
          replaceExitedSharks();
          updateRandomFishMutationCheck();
          updateSharkPopulation();
          updateEdgeTransitPopulation();
          accumulator -= fixedStep;
          steps += 1;
        }
        if (steps === maxStepsPerFrame) {
          accumulator = 0;
        }
        renderer.render(world);
        frameHandle = window.requestAnimationFrame(animate);
      }

      function syncAnimation() {
        if (isPaused()) {
          stopAnimation();
          return;
        }
        if (!frameHandle) {
          lastFrameTime = 0;
          frameHandle = window.requestAnimationFrame(animate);
        }
      }

      resizeObserver.observe(canvas);
      document.addEventListener("visibilitychange", syncAnimation);
      new MutationObserver(syncAnimation).observe(document.body, {
        attributes: true,
        attributeFilter: ["class"]
      });
      if (typeof reducedMotion.addEventListener === "function") {
        reducedMotion.addEventListener("change", syncAnimation);
      } else {
        reducedMotion.addListener(syncAnimation);
      }
      resizeWorld();
      syncAnimation();
    }

      if (memory.isPhoto) {
        const picture = document.createElement("span");
        picture.className = "memory-orbit__picture";
        picture.setAttribute("aria-hidden", "true");
        button.append(picture);
      }
      button.append(title);

      button.addEventListener("click", function () {
        if (activeHoverPreview && activeTrigger === button) {
          closeMemory();
          return;
        }
        openMemory(memory, button, false);
      });

      return button;
    }

    function shuffledMemories(memories) {
      const items = memories.slice();
      for (let index = items.length - 1; index > 0; index -= 1) {
        const otherIndex = Math.floor(Math.random() * (index + 1));
        [items[index], items[otherIndex]] = [items[otherIndex], items[index]];
      }
      return items;
    }

    function renderMemoryExamples() {
      const positions = [
        "memory-orbit--one",
        "memory-orbit--two",
        "memory-orbit--three",
        "memory-orbit--four"
      ];
      const photoMemory = exampleMemories.find(function (memory) {
        return memory.isPhoto;
      });
      const otherMemories = exampleMemories.filter(function (memory) {
        return !memory.isPhoto;
      });
      const examples = shuffledMemories(otherMemories).slice(0, 3);
      examples.push(photoMemory);
      const arrangedExamples = shuffledMemories(examples);
      arrangedExamples.forEach(function (memory, index) {
        memoryField.append(makeMemoryButton(memory, positions[index]));
      });
    }

    function renderExampleList() {
      const examples = shuffledMemories(exampleMemories);
      examples.forEach(function (memory) {
        const item = document.createElement("li");
        const button = document.createElement("button");
        const title = document.createElement("span");
        const time = document.createElement("span");

        button.type = "button";
        button.className = "demo-list-item";
        button.setAttribute("aria-label", "開啟示範內容：" + memory.title);
        title.className = "demo-list-item__title";
        title.textContent = "示範內容・" + memory.title;
        time.className = "demo-list-item__time";
        time.textContent = memory.time;
        button.append(title, time);
        button.addEventListener("click", function () {
          openMemory(memory, button);
        });
        item.append(button);
        listItems.append(item);
      });
    }

    const demoStates = [
      "示範空資料狀態：目前沒有真實記錄；畫面上的卡片只用來展示樣式。",
      "示範載入狀態：這是介面預覽，沒有讀取網絡或資料。",
      "示範錯誤狀態：沒有連接資料服務；可重設此示範狀態。"
    ];

    function showNextState() {
      stateIndex = (stateIndex + 1) % demoStates.length;
      statePanel.hidden = false;
      stateText.textContent = demoStates[stateIndex];
      stateToggleButton.setAttribute("aria-expanded", "true");
      statePanel.scrollIntoView({ block: "nearest" });
    }

    function resetState() {
      stateIndex = -1;
      stateText.textContent = "示範狀態已重設；沒有進行資料操作。";
    }

    attachmentButton.addEventListener("click", function () {
      attachmentInput.click();
    });

    attachmentInput.addEventListener("change", function () {
      const attachments = Array.from(attachmentInput.files || []);
      attachmentCount.hidden = attachments.length === 0;
      attachmentCount.textContent = attachments.length ? String(attachments.length) : "";
      attachmentButton.setAttribute(
        "aria-label",
        attachments.length
          ? "加入更多附件；已選擇 " + attachments.length + " 個附件"
          : "加入附件"
      );
      if (formMessage.dataset.kind === "error") {
        delete formMessage.dataset.kind;
      }
      formMessage.textContent = attachments.length
        ? "已選擇 " + attachments.length + " 個附件；示範不會上傳。"
        : "";
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      const value = memoryInput.value.trim();
      const attachments = Array.from(attachmentInput.files || []);

      if (!value && attachments.length === 0) {
        formMessage.dataset.kind = "error";
        memoryInput.setAttribute("aria-invalid", "true");
        formMessage.textContent = "示範提示：先寫一點內容再預覽；輸入不會保存。";
        memoryInput.focus();
        return;
      }

      delete formMessage.dataset.kind;
      memoryInput.removeAttribute("aria-invalid");
      const attachmentNames = attachments.map(function (file) {
        return file.name;
      });
      formMessage.textContent = attachments.length
        ? "示範卡片已開啟；附件不會保存或上傳。"
        : "示範卡片已開啟；輸入不會保存。";
      openMemory({
        category: "此刻的想法",
        time: "剛剛",
        title: value || attachmentNames[0],
        description: attachments.length
          ? "附件：" + attachmentNames.join("、") + "。這是暫時的示範內容，不會保存或上傳。"
          : "這是暫時的示範輸入，不會保存。",
        isPhoto: false
      }, memoryInput, false);
    });

    stateToggleButton.addEventListener("click", function () {
      if (statePanel.hidden) {
        statePanel.hidden = false;
        stateToggleButton.setAttribute("aria-expanded", "true");
        showNextState();
      } else {
        statePanel.hidden = true;
        stateToggleButton.setAttribute("aria-expanded", "false");
      }
    });

    nextStateButton.addEventListener("click", showNextState);
    resetStateButton.addEventListener("click", resetState);

    listToggleButton.addEventListener("click", function () {
      const willOpen = listPanel.hidden;
      listPanel.hidden = !willOpen;
      listToggleButton.setAttribute("aria-expanded", String(willOpen));
      if (willOpen) {
        listPanel.scrollIntoView({ block: "nearest" });
      }
    });

    memoryInput.addEventListener("input", function () {
      memoryInput.removeAttribute("aria-invalid");
      if (formMessage.dataset.kind === "error") {
        delete formMessage.dataset.kind;
        formMessage.textContent = "";
      }
    });

    closeDialogButton.addEventListener("click", function () {
      closeMemory();
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && memoryDialog.open) {
        event.preventDefault();
        closeMemory();
      }
    });

    if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
      document.addEventListener("pointermove", function (event) {
        if (
          event.pointerType !== "mouse" ||
          (event.movementX === 0 && event.movementY === 0)
        ) {
          return;
        }

        const trigger = event.target instanceof Element
          ? event.target.closest(".memory-orbit")
          : null;
        if (!trigger) {
          if (activeHoverPreview) {
            closeMemory();
          }
          hoverSuppressed = false;
          return;
        }
        if (hoverSuppressed || memoryDialog.open) {
          return;
        }

        const memory = exampleMemories.find(function (item) {
          return item.title === trigger.dataset.memoryTitle;
        });
        if (memory) {
          openMemory(memory, trigger, true);
        }
      });

      document.addEventListener("pointerleave", function (event) {
        if (event.pointerType === "mouse" && activeHoverPreview) {
          closeMemory();
        }
      });
    }

    memoryDialog.addEventListener("close", completeMemoryClose);
    window.addEventListener("resize", function () {
      if (memoryDialog.open && activeHoverPreview) {
        positionHoverDialog();
      }
    });

    renderMemoryExamples();
    renderExampleList();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function (error) {
          console.error("Service worker registration failed.", error);
        });
      });
    }
  </script>
</body>
</html>
