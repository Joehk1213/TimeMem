<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="description" content="TimeMem 示範介面：感受記憶回顧與記錄互動。">
  <title>TimeMem｜Remember what matters?</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <style>
    :root {
      --頁面底色: #FFFFFF;
      --卡片底色: #FFFFFF;
      --對話框底色: #FFFFFF;
      --品牌主色: #303030;
      --品牌深色: #171717;
      --品牌淺色: #F4F6F8;
      --主要文字色: #1D1D1D;
      --次要文字色: #4F4F4F;
      --邊框色: #E1E5E9;
      --成功色: #315D43;
      --提醒色: #77500B;
      --錯誤色: #9B3028;
      --鍵盤焦點色: #175A83;
      --遮罩色: rgba(24, 32, 40, 0.28);
      --介面字體: system-ui, sans-serif;
      --字元字體: ui-monospace, SFMono-Regular, Consolas, monospace;
      --背景鯊魚透明度: 1;
      --記憶卡透明面: rgba(255, 255, 255, 0.22);
      --輸入聚焦底色: #F8FAFC;
      --標題大小: 1.5rem;
      --正文大小: 1rem;
      --輔助文字大小: 0.875rem;
      --正文行高: 1.6;
      --間距極細: 0.25rem;
      --間距細: 0.5rem;
      --間距小: 0.75rem;
      --間距中: 1rem;
      --間距大: 1.5rem;
      --間距特大: 2rem;
      --小圓角: 0.5rem;
      --欄位圓角: 0.75rem;
      --卡片圓角: 1rem;
      --浮層陰影: 0 12px 32px rgba(24, 32, 40, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: #FFFFFF;
      scroll-behavior: smooth;
    }

    body {
      position: relative;
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      margin: 0;
      overflow-x: hidden;
      background: linear-gradient(
        180deg,
        #C6C6C6 0%,
        #F1F1F1 16%,
        #FFFFFF 32%,
        #FFFFFF 84%,
        #F2F2F2 100%
      );
      color: var(--主要文字色);
      font-family: var(--介面字體);
      font-size: var(--正文大小);
      line-height: var(--正文行高);
    }

    button,
    input {
      font: inherit;
    }

    button {
      min-width: 44px;
      min-height: 44px;
      border: 1px solid var(--邊框色);
      border-radius: var(--小圓角);
      padding: var(--間距細) var(--間距中);
      background: #FFFFFF;
      color: var(--主要文字色);
      cursor: pointer;
      text-decoration: none;
      text-underline-offset: 0.2em;
      transition: background-color 140ms ease, border-color 140ms ease, transform 140ms ease;
    }

    button:hover {
      border-color: #C8D0D8;
      background: #F8FAFC;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    :focus-visible {
      outline: 3px solid var(--鍵盤焦點色);
      outline-offset: 3px;
    }

    .site-header {
      position: relative;
      z-index: 4;
      display: flex;
      width: min(100% - 40px, 1120px);
      min-height: 80px;
      align-items: center;
      justify-content: space-between;
      gap: var(--間距中);
      margin: 0 auto;
      border-bottom: 1px solid var(--邊框色);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: var(--間距小);
      color: var(--主要文字色);
      font-size: 1.125rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-decoration: none;
    }

    .demo-badge,
    .demo-label {
      display: inline-flex;
      min-height: 28px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--邊框色);
      border-radius: 999px;
      padding: 0.1rem 0.65rem;
      background: var(--品牌淺色);
      color: var(--品牌深色);
      font-size: var(--輔助文字大小);
      font-weight: 700;
      line-height: 1.35;
      white-space: nowrap;
    }

    .demo-badge,
    .demo-label,
    .header-actions,
    .demo-controls,
    .site-footer {
      display: none;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: var(--間距細);
    }

    .button-secondary {
      border-color: var(--邊框色);
      background: #FFFFFF;
      color: var(--品牌深色);
    }

    .button-secondary:hover {
      border-color: #C8D0D8;
      background: #F8FAFC;
      color: var(--品牌深色);
    }

    .memory-field {
      position: fixed;
      z-index: 1;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .fish-field {
      position: fixed;
      z-index: 0;
      width: 100vw;
      height: 100vh;
      inset: 0;
      display: block;
      overflow: hidden;
      pointer-events: none;
      color: #1B1B1B;
      font-family: var(--字元字體);
      filter: blur(0.32px);
      opacity: var(--背景鯊魚透明度);
    }

    .memory-orbit {
      position: absolute;
      z-index: 2;
      display: grid;
      width: 196px;
      min-height: 84px;
      justify-items: start;
      align-content: start;
      gap: var(--間距細);
      border: 1px solid rgba(140, 150, 160, 0.34);
      border-radius: var(--卡片圓角);
      padding: var(--間距中);
      background: var(--記憶卡透明面);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 8px 24px rgba(24, 32, 40, 0.035);
      color: var(--主要文字色);
      pointer-events: auto;
      text-align: left;
      text-decoration: none;
      animation: memory-drift var(--漂移時間, 28s) ease-in-out var(--漂移延遲, 0s) infinite alternate;
      transform-origin: center;
    }

    .memory-orbit:hover,
    .memory-orbit:focus-visible {
      z-index: 2;
      border-color: #C8D0D8;
      background: var(--記憶卡透明面);
      color: var(--主要文字色);
    }

    .memory-orbit:hover {
      animation-play-state: paused;
    }

    body.回顧已開啟 .memory-orbit {
      animation-play-state: paused;
    }

    .memory-orbit--one {
      top: 20%;
      left: max(18px, calc((100vw - 1160px) / 2));
    }

    .memory-orbit--two {
      top: 24%;
      right: max(18px, calc((100vw - 1160px) / 2));
    }

    .memory-orbit--three {
      bottom: 17%;
      left: max(42px, calc((100vw - 1100px) / 2));
    }

    .memory-orbit--four {
      right: max(42px, calc((100vw - 1100px) / 2));
      bottom: 14%;
    }

    .memory-orbit__topline {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: var(--間距細);
    }

    .memory-orbit__category {
      color: var(--次要文字色);
      font-size: var(--輔助文字大小);
    }

    .memory-orbit__title {
      font-size: 0.95rem;
      font-weight: 650;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .memory-orbit__caption {
      color: var(--次要文字色);
      font-size: var(--輔助文字大小);
    }

    .memory-orbit__picture,
    .dialog-picture {
      display: flex;
      width: 100%;
      min-height: 68px;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(140, 150, 160, 0.34);
      border-radius: var(--小圓角);
      background: rgba(255, 255, 255, 0.04);
      color: var(--品牌深色);
      font-size: var(--輔助文字大小);
      font-weight: 650;
    }

    @keyframes memory-drift {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
        border-radius: 1rem;
      }

      24% {
        transform: translate3d(var(--漂移一橫向), var(--漂移一縱向), 0) rotate(var(--漂移一角度)) scale(var(--縮放幅度));
        border-radius: 1.45rem 0.85rem 1.2rem 0.75rem;
      }

      50% {
        transform: translate3d(var(--漂移二橫向), var(--漂移二縱向), 0) rotate(var(--漂移二角度)) scale(0.98);
        border-radius: 0.75rem 1.4rem 0.8rem 1.25rem;
      }

      76% {
        transform: translate3d(var(--漂移三橫向), var(--漂移三縱向), 0) rotate(var(--漂移三角度)) scale(1.03);
        border-radius: 1.2rem 0.8rem 1.45rem 0.85rem;
      }

      100% {
        transform: translate3d(var(--漂移四橫向), var(--漂移四縱向), 0) rotate(var(--漂移四角度)) scale(1);
        border-radius: 0.85rem 1.3rem 0.75rem 1.4rem;
      }
    }

    .page-main {
      position: relative;
      z-index: 2;
      display: flex;
      width: min(100% - 40px, 720px);
      flex: 1;
      align-self: center;
      flex-direction: column;
      justify-content: center;
      padding: clamp(1.5rem, 5vh, 3rem) 0;
      background: transparent;
      text-align: center;
    }

    .entry-layer {
      position: relative;
      isolation: isolate;
    }

    .entry-layer::before {
      position: absolute;
      z-index: 0;
      inset: -0.75rem 15%;
      border-radius: var(--卡片圓角);
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      content: "";
      pointer-events: none;
    }

    .entry-layer > * {
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      margin: 0 0 var(--間距小);
      color: var(--品牌深色);
      font-size: var(--輔助文字大小);
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1.2;
      text-wrap: balance;
    }

    .intro {
      max-width: 36rem;
      margin: var(--間距中) auto 0;
      color: var(--次要文字色);
    }

    .entry-form {
      display: grid;
      width: 70%;
      grid-template-columns: auto minmax(0, 1fr) auto;
      grid-template-areas: "attachment field submit";
      align-items: center;
      gap: var(--間距細);
      margin: var(--間距中) auto 0;
      border: 1px solid rgba(140, 150, 160, 0.3);
      border-radius: var(--卡片圓角);
      padding: var(--間距細);
      background: rgba(255, 255, 255, 0.72);
      text-align: left;
      transition: background-color 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
    }

    .entry-form:focus-within {
      border-color: #A8B3BD;
      box-shadow: 0 0 0 3px rgba(48, 48, 48, 0.08);
    }

    .field-wrap {
      grid-area: field;
      display: grid;
      gap: 0.125rem;
    }

    .field-wrap label {
      color: var(--次要文字色);
      font-size: var(--輔助文字大小);
      font-weight: 500;
    }

    .field-wrap label,
    .entry-note,
    .demo-message {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    .field-wrap input {
      width: 100%;
      min-width: 0;
      min-height: 44px;
      border: 0;
      border-radius: var(--小圓角);
      padding: 0.5rem 0.75rem;
      background: transparent;
      color: var(--主要文字色);
    }

    .field-wrap input:focus {
      background: transparent;
      outline: none;
    }

    .field-wrap input:focus-visible {
      outline: 3px solid var(--鍵盤焦點色);
      outline-offset: 3px;
    }

    .field-wrap input::placeholder {
      color: var(--次要文字色);
      opacity: 1;
    }

    .entry-form > button[type="submit"] {
      grid-area: submit;
      width: 48px;
      min-height: 44px;
      padding: 0;
      border-color: var(--品牌主色);
      background: var(--品牌主色);
      color: #FFFFFF;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .entry-form > button[type="submit"]:hover {
      border-color: var(--品牌深色);
      background: var(--品牌深色);
      color: #FFFFFF;
    }

    .entry-form .attachment-button {
      position: relative;
      grid-area: attachment;
      width: 44px;
      min-height: 44px;
      border-color: transparent;
      padding: 0;
      background: transparent;
      color: var(--次要文字色);
      font-size: 1.75rem;
      font-weight: 400;
      line-height: 1;
    }

    .entry-form .attachment-button:hover {
      border-color: transparent;
      background: var(--品牌淺色);
      color: var(--品牌深色);
    }

    .attachment-count {
      position: absolute;
      top: -0.2rem;
      right: -0.2rem;
      min-width: 1.1rem;
      border: 1px solid var(--邊框色);
      border-radius: 999px;
      padding: 0 0.2rem;
      background: #FFFFFF;
      color: var(--次要文字色);
      font-size: 0.65rem;
      line-height: 1rem;
    }

    .entry-note {
      margin: var(--間距細) 0 0;
      color: var(--次要文字色);
      font-size: 0.8rem;
      text-align: center;
    }

    .demo-message {
      min-height: 1.6em;
      margin: var(--間距小) 0 0;
      color: var(--品牌深色);
      text-align: left;
    }

    .demo-message[data-kind="error"] {
      position: static;
      width: auto;
      height: auto;
      overflow: visible;
      clip: auto;
      white-space: normal;
      color: var(--錯誤色);
    }

    .demo-state-panel,
    .demo-list {
      border: 1px solid var(--邊框色);
      border-radius: var(--卡片圓角);
      padding: var(--間距大);
      background: #FFFFFF;
      text-align: left;
    }

    .demo-state-panel h2,
    .demo-list h2 {
      margin: var(--間距細) 0;
      font-size: var(--標題大小);
      line-height: 1.35;
    }

    .demo-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--間距細);
      margin-top: var(--間距大);
    }

    .demo-state-panel,
    .demo-list {
      margin-top: var(--間距中);
    }

    .demo-state-panel[hidden],
    .demo-list[hidden],
    [hidden] {
      display: none;
    }

    .demo-state-text {
      margin: var(--間距細) 0 var(--間距中);
      color: var(--次要文字色);
    }

    .demo-list ul {
      display: grid;
      gap: 0;
      margin: var(--間距中) 0 0;
      padding: 0;
      list-style: none;
    }

    .demo-list li + li {
      border-top: 1px solid var(--邊框色);
    }

    .demo-list-item {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: var(--間距中);
      border: 0;
      border-radius: 0;
      padding: var(--間距中) var(--間距細);
      background: transparent;
      color: var(--主要文字色);
      text-decoration: none;
      text-align: left;
    }

    .demo-list-item:hover {
      border-color: transparent;
      background: transparent;
      color: var(--主要文字色);
    }

    .demo-list-item__title {
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 650;
    }

    .demo-list-item__time {
      flex: 0 0 auto;
      color: var(--次要文字色);
      font-size: var(--輔助文字大小);
    }

    .site-footer {
      position: relative;
      z-index: 1;
      width: min(100% - 40px, 1120px);
      margin: 0 auto;
      border-top: 1px solid var(--邊框色);
      padding: var(--間距中) 0 var(--間距大);
      color: var(--次要文字色);
      font-size: var(--輔助文字大小);
      text-align: center;
    }

    body .site-header .header-actions,
    body .page-main .demo-controls,
    body .site-footer {
      display: none;
    }

    dialog {
      width: min(92vw, 480px);
      max-height: min(82vh, 720px);
      overflow: auto;
      border: 1px solid var(--邊框色);
      border-radius: var(--卡片圓角);
      padding: var(--間距大);
      background: var(--對話框底色);
      color: var(--主要文字色);
      box-shadow: var(--浮層陰影);
    }

    dialog::backdrop {
      background: var(--遮罩色);
    }

    .memory-dialog--hover {
      position: fixed;
      inset: auto;
      z-index: 20;
      margin: 0;
      border-color: rgba(140, 150, 160, 0.34);
      pointer-events: none;
      background: #FFFFFF;
      opacity: 1;
      box-shadow: 0 16px 40px rgba(24, 32, 40, 0.2);
    }

    .memory-dialog--hover .dialog-actions {
      display: none;
    }

    dialog h2 {
      margin: var(--間距中) 0 var(--間距細);
      font-size: var(--標題大小);
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    dialog p {
      overflow-wrap: anywhere;
    }

    .dialog-meta {
      color: var(--次要文字色);
      font-size: var(--輔助文字大小);
    }

    .dialog-picture {
      min-height: 148px;
      margin: var(--間距中) 0;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: var(--間距大);
    }

    @media (max-width: 760px) {
      :root {
        --背景鯊魚透明度: 1;
      }

      .site-header {
        width: min(100% - 28px, 1120px);
        min-height: 72px;
        gap: var(--間距細);
      }

      .brand {
        gap: var(--間距細);
        font-size: 1rem;
      }

      .header-actions {
        gap: 0.35rem;
      }

      .header-actions button {
        padding-inline: var(--間距細);
        font-size: var(--輔助文字大小);
      }

      .page-main {
        width: min(100% - 32px, 720px);
        padding-top: clamp(2.5rem, 8vh, 4rem);
        background: transparent;
      }
    }

    @media (max-width: 480px) {
      .site-header {
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        padding: var(--間距小) 0;
      }

      .header-actions {
        width: 100%;
        justify-content: flex-start;
      }

      .page-main {
        width: min(100% - 32px, 720px);
        padding-top: 3rem;
      }

      .entry-form {
        width: 100%;
        gap: var(--間距小);
        margin-top: var(--間距大);
      }

      .entry-layer::before {
        inset: -0.75rem -1rem;
      }

      .demo-state-panel,
      .demo-list {
        padding: var(--間距中);
      }

      .demo-list-item {
        align-items: flex-start;
        flex-direction: column;
        gap: var(--間距細);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .memory-orbit {
        animation-name: memory-drift !important;
        animation-duration: var(--漂移時間, 15s) !important;
        animation-iteration-count: infinite !important;
        animation-direction: alternate !important;
      }

    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="TimeMem 示範首頁">
      <span>TimeMem</span>
      <span class="demo-badge">示範</span>
    </a>
    <nav class="header-actions" aria-label="示範操作">
      <button class="button-secondary" id="toggle-state" type="button" aria-controls="demo-state" aria-expanded="false">展示狀態</button>
      <button class="button-secondary" id="toggle-list" type="button" aria-controls="demo-list" aria-expanded="false">查看示範列表</button>
    </nav>
  </header>

  <main class="page-main">
    <div class="entry-layer">
      <h1>Remember what matters?</h1>

      <form class="entry-form" id="memory-form" novalidate>
        <div class="field-wrap">
          <label class="visually-hidden" for="memory-input">此刻的想法</label>
          <input id="memory-input" name="memory" type="text" maxlength="240" autocomplete="off" aria-describedby="entry-note">
        </div>
        <input class="visually-hidden" id="attachment-input" name="attachments" type="file" multiple tabindex="-1">
        <button class="attachment-button" id="attachment-button" type="button" aria-label="加入附件">+<span class="attachment-count" id="attachment-count" hidden aria-live="polite"></span></button>
        <button type="submit" aria-label="顯示預覽">→</button>
      </form>
    </div>

          for (let index = 0; index < nodes.length; index += 2) {
            minX = Math.min(minX, nodes[index]);
            maxX = Math.max(maxX, nodes[index]);
            minY = Math.min(minY, nodes[index + 1]);
            maxY = Math.max(maxY, nodes[index + 1]);
          }

          const offsetX = minX < margin
            ? margin - minX
            : maxX > world.width - margin
              ? world.width - margin - maxX
              : 0;
          const offsetY = minY < margin
            ? margin - minY
            : maxY > world.height - margin
              ? world.height - margin - maxY
              : 0;
          if (offsetX === 0 && offsetY === 0) {
            return;
          }

          for (let index = 0; index < nodes.length; index += 2) {
            nodes[index] += offsetX;
            nodes[index + 1] += offsetY;
          }
          shark.roamX = Math.min(world.width - margin, Math.max(margin, shark.roamX + offsetX));
          shark.roamY = Math.min(world.height - margin, Math.max(margin, shark.roamY + offsetY));
        });
      }

      function resizeWorld() {
        const bounds = canvas.getBoundingClientRect();
        if (bounds.width < 1 || bounds.height < 1) {
          return;
        }
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
        renderer.resize(bounds.width, bounds.height, pixelRatio);
        world.resize(bounds.width, bounds.height, renderer.cellWidth, renderer.cellHeight);
        if (!sharkSpeedsAssigned && world.sharks.length) {
          const usedSpeedMultipliers = new Set();
          world.sharks.forEach(function (shark) {
            let speedMultiplier;
            do {
              speedMultiplier = randomBetween(1, 2.2);
            } while (usedSpeedMultipliers.has(speedMultiplier));
            usedSpeedMultipliers.add(speedMultiplier);
            shark.pace = speedMultiplier / simulationSpeed;
          });
          sharkSpeedsAssigned = true;
        }
        keepSharksInView();
        renderer.render(world);
      }

      function stopAnimation() {
        if (frameHandle) {
          window.cancelAnimationFrame(frameHandle);
          frameHandle = 0;
        }
        lastFrameTime = 0;
        accumulator = 0;
      }

      function animate(now) {
        frameHandle = 0;
        if (isPaused()) {
          stopAnimation();
          return;
        }
        const elapsed = lastFrameTime ? Math.min((now - lastFrameTime) / 1000, 0.1) : 0;
        lastFrameTime = now;
        accumulator += elapsed * simulationSpeed;
        let steps = 0;
        while (accumulator >= fixedStep && steps < maxStepsPerFrame) {
          world.step(fixedStep);
          keepSharksInView();
          accumulator -= fixedStep;
          steps += 1;
        }
        if (steps === maxStepsPerFrame) {
          accumulator = 0;
        }
        renderer.render(world);
        frameHandle = window.requestAnimationFrame(animate);
      }

      function syncAnimation() {
        if (isPaused()) {
          stopAnimation();
          return;
        }
        if (!frameHandle) {
          lastFrameTime = 0;
          frameHandle = window.requestAnimationFrame(animate);
        }
      }

      resizeObserver.observe(canvas);
      document.addEventListener("visibilitychange", syncAnimation);
      new MutationObserver(syncAnimation).observe(document.body, {
        attributes: true,
        attributeFilter: ["class"]
      });
      if (typeof reducedMotion.addEventListener === "function") {
        reducedMotion.addEventListener("change", syncAnimation);
      } else {
        reducedMotion.addListener(syncAnimation);
      }
      resizeWorld();
      syncAnimation();
    }
    const memoryDialog = document.getElementById("memory-dialog");
    const dialogMeta = document.getElementById("dialog-meta");
    const dialogTitle = document.getElementById("dialog-title");
    const dialogDescription = document.getElementById("dialog-description");
    const dialogPicture = document.getElementById("dialog-picture");
    const closeDialogButton = document.getElementById("close-dialog");
    const form = document.getElementById("memory-form");
    const memoryInput = document.getElementById("memory-input");
    const attachmentInput = document.getElementById("attachment-input");
    const attachmentButton = document.getElementById("attachment-button");
    const attachmentCount = document.getElementById("attachment-count");
    const formMessage = document.getElementById("form-message");
    const statePanel = document.getElementById("demo-state");
    const stateText = document.getElementById("demo-state-text");
    const stateToggleButton = document.getElementById("toggle-state");
    const nextStateButton = document.getElementById("next-state");
    const resetStateButton = document.getElementById("reset-state");
    const listPanel = document.getElementById("demo-list");
    const listToggleButton = document.getElementById("toggle-list");
    const listItems = document.getElementById("demo-list-items");
    let activeTrigger = null;
    let activeHoverPreview = false;
    let stateIndex = -1;
    let hoverSuppressed = false;
    let closeHandled = true;

    function randomBetween(minimum, maximum) {
      return Math.random() * (maximum - minimum) + minimum;
    }

    function completeMemoryClose() {
      if (closeHandled) {
        return;
      }

      closeHandled = true;
      document.body.classList.remove("回顧已開啟");
      hoverSuppressed = true;
      if (activeTrigger && activeTrigger.isConnected && !activeHoverPreview) {
        activeTrigger.focus();
      }
      activeTrigger = null;
      activeHoverPreview = false;
      memoryDialog.classList.remove("memory-dialog--hover");
      memoryDialog.style.removeProperty("left");
      memoryDialog.style.removeProperty("top");
    }

    function closeMemory() {
      if (!memoryDialog.open) {
        return;
      }

      memoryDialog.close();
      completeMemoryClose();
    }

    function positionHoverDialog() {
      const dialogBounds = memoryDialog.getBoundingClientRect();
      const left = (window.innerWidth - dialogBounds.width) / 2;
      const top = (window.innerHeight - dialogBounds.height) / 2;
      memoryDialog.style.left = left + "px";
      memoryDialog.style.top = top + "px";
    }

    function openMemory(memory, trigger, hoverPreview) {
      if (memoryDialog.open) {
        return;
      }

      closeHandled = false;
      activeTrigger = trigger;
      activeHoverPreview = hoverPreview;
      dialogMeta.textContent = memory.category + "・" + memory.time;
      dialogTitle.textContent = memory.title;
      dialogDescription.textContent = memory.description;
      dialogPicture.hidden = !memory.isPhoto;

      if (hoverPreview) {
        memoryDialog.classList.add("memory-dialog--hover");
        memoryDialog.show();
        positionHoverDialog();
      } else {
        memoryDialog.classList.remove("memory-dialog--hover");
        memoryDialog.style.removeProperty("left");
        memoryDialog.style.removeProperty("top");
        document.body.classList.add("回顧已開啟");
        memoryDialog.showModal();
        closeDialogButton.focus();
      }
    }

    function makeMemoryButton(memory, positionClass) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "memory-orbit " + positionClass;
      button.setAttribute("aria-label", memory.title);
      button.dataset.memoryTitle = memory.title;
      button.style.setProperty("--漂移一橫向", Math.round(randomBetween(-42, 42)) + "px");
      button.style.setProperty("--漂移一縱向", Math.round(randomBetween(-32, 32)) + "px");
      button.style.setProperty("--漂移二橫向", Math.round(randomBetween(-36, 36)) + "px");
      button.style.setProperty("--漂移二縱向", Math.round(randomBetween(-38, 38)) + "px");
      button.style.setProperty("--漂移三橫向", Math.round(randomBetween(-40, 40)) + "px");
      button.style.setProperty("--漂移三縱向", Math.round(randomBetween(-30, 30)) + "px");
      button.style.setProperty("--漂移四橫向", Math.round(randomBetween(-34, 34)) + "px");
      button.style.setProperty("--漂移四縱向", Math.round(randomBetween(-36, 36)) + "px");
      button.style.setProperty("--漂移一角度", randomBetween(-4, 4).toFixed(1) + "deg");
      button.style.setProperty("--漂移二角度", randomBetween(-4, 4).toFixed(1) + "deg");
      button.style.setProperty("--漂移三角度", randomBetween(-4, 4).toFixed(1) + "deg");
      button.style.setProperty("--漂移四角度", randomBetween(-4, 4).toFixed(1) + "deg");
      button.style.setProperty("--縮放幅度", randomBetween(0.96, 1.05).toFixed(3));
      button.style.setProperty("--漂移時間", randomBetween(5.5, 8.5).toFixed(2) + "s");
      button.style.setProperty("--漂移延遲", -Math.round(randomBetween(0, 8)) + "s");

      const category = document.createElement("span");
      category.className = "memory-orbit__category";
      category.textContent = memory.category.replace(/^示範/, "");

      const title = document.createElement("span");
      title.className = "memory-orbit__title";
      title.textContent = memory.title;

      button.append(category);
      if (memory.isPhoto) {
        const picture = document.createElement("span");
        picture.className = "memory-orbit__picture";
        picture.setAttribute("aria-hidden", "true");
        button.append(picture);
      }
      button.append(title);

      button.addEventListener("click", function () {
        if (activeHoverPreview && activeTrigger === button) {
          closeMemory();
          return;
        }
        openMemory(memory, button, false);
      });

      return button;
    }

    function shuffledMemories(memories) {
      const items = memories.slice();
      for (let index = items.length - 1; index > 0; index -= 1) {
        const otherIndex = Math.floor(Math.random() * (index + 1));
        [items[index], items[otherIndex]] = [items[otherIndex], items[index]];
      }
      return items;
    }

    function renderMemoryExamples() {
      const positions = [
        "memory-orbit--one",
        "memory-orbit--two",
        "memory-orbit--three",
        "memory-orbit--four"
      ];
      const photoMemory = exampleMemories.find(function (memory) {
        return memory.isPhoto;
      });
      const otherMemories = exampleMemories.filter(function (memory) {
        return !memory.isPhoto;
      });
      const examples = shuffledMemories(otherMemories).slice(0, 3);
      examples.push(photoMemory);
      const arrangedExamples = shuffledMemories(examples);
      arrangedExamples.forEach(function (memory, index) {
        memoryField.append(makeMemoryButton(memory, positions[index]));
      });
    }

    function renderExampleList() {
      const examples = shuffledMemories(exampleMemories);
      examples.forEach(function (memory) {
        const item = document.createElement("li");
        const button = document.createElement("button");
        const title = document.createElement("span");
        const time = document.createElement("span");

        button.type = "button";
        button.className = "demo-list-item";
        button.setAttribute("aria-label", "開啟示範內容：" + memory.title);
        title.className = "demo-list-item__title";
        title.textContent = "示範內容・" + memory.title;
        time.className = "demo-list-item__time";
        time.textContent = memory.time;
        button.append(title, time);
        button.addEventListener("click", function () {
          openMemory(memory, button);
        });
        item.append(button);
        listItems.append(item);
      });
    }

    const demoStates = [
      "示範空資料狀態：目前沒有真實記錄；畫面上的卡片只用來展示樣式。",
      "示範載入狀態：這是介面預覽，沒有讀取網絡或資料。",
      "示範錯誤狀態：沒有連接資料服務；可重設此示範狀態。"
    ];

    function showNextState() {
      stateIndex = (stateIndex + 1) % demoStates.length;
      statePanel.hidden = false;
      stateText.textContent = demoStates[stateIndex];
      stateToggleButton.setAttribute("aria-expanded", "true");
      statePanel.scrollIntoView({ block: "nearest" });
    }

    function resetState() {
      stateIndex = -1;
      stateText.textContent = "示範狀態已重設；沒有進行資料操作。";
    }

    attachmentButton.addEventListener("click", function () {
      attachmentInput.click();
    });

    attachmentInput.addEventListener("change", function () {
      const attachments = Array.from(attachmentInput.files || []);
      attachmentCount.hidden = attachments.length === 0;
      attachmentCount.textContent = attachments.length ? String(attachments.length) : "";
      attachmentButton.setAttribute(
        "aria-label",
        attachments.length
          ? "加入更多附件；已選擇 " + attachments.length + " 個附件"
          : "加入附件"
      );
      if (formMessage.dataset.kind === "error") {
        delete formMessage.dataset.kind;
      }
      formMessage.textContent = attachments.length
        ? "已選擇 " + attachments.length + " 個附件；示範不會上傳。"
        : "";
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();
      const value = memoryInput.value.trim();
      const attachments = Array.from(attachmentInput.files || []);

      if (!value && attachments.length === 0) {
        formMessage.dataset.kind = "error";
        memoryInput.setAttribute("aria-invalid", "true");
        formMessage.textContent = "示範提示：先寫一點內容再預覽；輸入不會保存。";
        memoryInput.focus();
        return;
      }

      delete formMessage.dataset.kind;
      memoryInput.removeAttribute("aria-invalid");
      const attachmentNames = attachments.map(function (file) {
        return file.name;
      });
      formMessage.textContent = attachments.length
        ? "示範卡片已開啟；附件不會保存或上傳。"
        : "示範卡片已開啟；輸入不會保存。";
      openMemory({
        category: "此刻的想法",
        time: "剛剛",
        title: value || attachmentNames[0],
        description: attachments.length
          ? "附件：" + attachmentNames.join("、") + "。這是暫時的示範內容，不會保存或上傳。"
          : "這是暫時的示範輸入，不會保存。",
        isPhoto: false
      }, memoryInput, false);
    });

    stateToggleButton.addEventListener("click", function () {
      if (statePanel.hidden) {
        statePanel.hidden = false;
        stateToggleButton.setAttribute("aria-expanded", "true");
        showNextState();
      } else {
        statePanel.hidden = true;
        stateToggleButton.setAttribute("aria-expanded", "false");
      }
    });

    nextStateButton.addEventListener("click", showNextState);
    resetStateButton.addEventListener("click", resetState);

    listToggleButton.addEventListener("click", function () {
      const willOpen = listPanel.hidden;
      listPanel.hidden = !willOpen;
      listToggleButton.setAttribute("aria-expanded", String(willOpen));
      if (willOpen) {
        listPanel.scrollIntoView({ block: "nearest" });
      }
    });

    memoryInput.addEventListener("input", function () {
      memoryInput.removeAttribute("aria-invalid");
      if (formMessage.dataset.kind === "error") {
        delete formMessage.dataset.kind;
        formMessage.textContent = "";
      }
    });

    closeDialogButton.addEventListener("click", function () {
      closeMemory();
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && memoryDialog.open) {
        event.preventDefault();
        closeMemory();
      }
    });

    if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
      document.addEventListener("pointermove", function (event) {
        if (
          event.pointerType !== "mouse" ||
          (event.movementX === 0 && event.movementY === 0)
        ) {
          return;
        }

        const trigger = event.target instanceof Element
          ? event.target.closest(".memory-orbit")
          : null;
        if (!trigger) {
          if (activeHoverPreview) {
            closeMemory();
          }
          hoverSuppressed = false;
          return;
        }
        if (hoverSuppressed || memoryDialog.open) {
          return;
        }

        const memory = exampleMemories.find(function (item) {
          return item.title === trigger.dataset.memoryTitle;
        });
        if (memory) {
          openMemory(memory, trigger, true);
        }
      });

      document.addEventListener("pointerleave", function (event) {
        if (event.pointerType === "mouse" && activeHoverPreview) {
          closeMemory();
        }
      });
    }

    memoryDialog.addEventListener("close", completeMemoryClose);
    window.addEventListener("resize", function () {
      if (memoryDialog.open && activeHoverPreview) {
        positionHoverDialog();
      }
    });

    renderMemoryExamples();
    renderExampleList();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function (error) {
          console.error("Service worker registration failed.", error);
        });
      });
    }
  </script>
</body>
</html>
