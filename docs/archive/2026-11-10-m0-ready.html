  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke, opacity, box-shadow, transform, filter, backdrop-filter;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
  transition-duration: 150ms;
}

:root{
  --paper:#FFF8EC;
  --ink:#1E1A16;
  --muted:#6B6157;
  --line:#2A241E;
  --surface:#FFF8EC;
  --card-line:rgba(30,26,22,.18);
}

@media (prefers-color-scheme: dark){
  :root{
    --paper:#1E1B17;
    --ink:#FFF5E4;
    --muted:#D5C9B6;
    --line:#FFF5E4;
    --surface:#1E1B17;
    --card-line:rgba(255,245,228,.28);
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"PingFang HK","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif
}

button{
  font:inherit
}

.mono{
  font-family:"SF Mono",ui-monospace,"Cascadia Code","Microsoft JhengHei",monospace
}

@media print{
  body{
    background:#fff!important;
    color:#000!important
  }

  .no-print{
    display:none!important
  }

  .print-card{
    -moz-column-break-inside:avoid;
         break-inside:avoid;
    box-shadow:none!important;
    border:1.5px solid #111!important
  }
}

.active\:translate-y-0\.5:active {
  --tw-translate-y: 0.125rem;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

@media (min-width: 640px) {
  .sm\:block {
    display: block;
  }

  .sm\:inline {
    display: inline;
  }

  .sm\:p-7 {
    padding: 1.75rem;
  }

  .sm\:px-6 {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:pt-9 {
    padding-top: 2.25rem;
  }

  .sm\:text-\[14px\] {
    font-size: 14px;
  }

  .sm\:text-\[21px\] {
    font-size: 21px;
  }

  .sm\:text-\[24px\] {
    font-size: 24px;
  }

  .sm\:text-\[32px\] {
    font-size: 32px;
  }

  .sm\:text-\[62px\] {
    font-size: 62px;
  }
}

@media (min-width: 1024px) {
  .lg\:col-span-1 {
    grid-column: span 1 / span 1;
  }

  .lg\:grid-cols-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .lg\:gap-7 {
    gap: 1.75rem;
  }

  .lg\:px-8 {
    padding-left: 2rem;
    padding-right: 2rem;
  }
}
